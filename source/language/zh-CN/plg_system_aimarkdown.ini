PLG_SYSTEM_AIMARKDOWN_CUSTOM_EXCLUDE_SELECTORS_DESC="每行输入一个选择器，匹配的元素将从 Markdown 中移除。支持的格式：<br>• CSS 类：.promo-banner, .newsletter-popup<br>• CSS ID：#live-chat, #cookie-bar<br>• HTML 标签：aside, dialog<br>• 带类的标签：div.popup, section.advert<br>• XPath：//div[@data-banner='true']"
