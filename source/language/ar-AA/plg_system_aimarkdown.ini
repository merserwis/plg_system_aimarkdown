PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_LABEL="نمط عناوين URL في Gridbox"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_DESC="طريقة بناء عناوين URL لصفحات Gridbox وتصنيفاتها. «قانوني (عنصر القائمة + الموجّه)» (الافتراضي) = مسار موجّه Gridbox تحت عنصر القائمة الذي يعرض تطبيق Gridbox الخاص بالصفحة، مثل /oferta/category/page، وهو العنوان نفسه في الرابط القانوني لـ Gridbox وخريطة الموقع؛ والصفحات التي لها عنصر قائمة خاص بها تستخدم عنوانه. «موجّه Joomla» = مسار الموجّه من جذر الموقع، مثل /category/page (سلوك الإصدار 1.5.3). «الاسم المستعار» = الجذر + الاسم المستعار (سلوك الإصدارات حتى 1.5.1؛ يكون صحيحًا فقط عندما تقع كل صفحة Gridbox مباشرة تحت /alias)."
