PLG_SYSTEM_AIMARKDOWN_EXTRA_QUERY_PARAMS_LABEL="Додаткові параметри адреси"
PLG_SYSTEM_AIMARKDOWN_EXTRA_QUERY_PARAMS_DESC="Параметри адреси, що змінюють вміст сторінки на вашому сайті й мають залишатися в адресі Markdown і ключі кешу, через кому (напр. filter_brand, sort). Параметри маршрутизації Joomla і Gridbox, пагінації, пошуку та фільтрів зберігаються завжди; інші (utm_*, fbclid, випадкові значення) ігноруються, щоб не заповнювати кеш."
PLG_SYSTEM_AIMARKDOWN_CUSTOM_EXCLUDE_SELECTORS_LABEL="Власні селектори виключення"
PLG_SYSTEM_AIMARKDOWN_CUSTOM_EXCLUDE_SELECTORS_DESC="Вкажіть по одному селектору в рядку; відповідні елементи буде видалено з Markdown. Підтримувані формати:<br>• Клас CSS: .promo-banner, .newsletter-popup<br>• ID CSS: #live-chat, #cookie-bar<br>• Тег HTML: aside, dialog<br>• Тег із класом: div.popup, section.advert<br>• XPath: //div[@data-banner='true']"
