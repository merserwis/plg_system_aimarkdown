PLG_SYSTEM_AIMARKDOWN_ENABLE_FRONTMATTER_LABEL="Увімкнути YAML Frontmatter"
PLG_SYSTEM_AIMARKDOWN_ENABLE_FRONTMATTER_DESC="Додає на початок Markdown структуровані метадані YAML для LLM (назва, ціна, нетто/брутто B2B, SKU, наявність, категорія, файли для завантаження, продавець)."
PLG_SYSTEM_AIMARKDOWN_ENABLE_FAQ_LABEL="Увімкнути розділ FAQ товару"
PLG_SYSTEM_AIMARKDOWN_ENABLE_FAQ_DESC="Додає до Markdown структурований FAQ. Пріоритет мають власна схема FAQPage та блоки details з опису; за їх відсутності автоматично створюються контекстні запитання й відповіді."
PLG_SYSTEM_AIMARKDOWN_AUTO_GENERATE_FAQ_LABEL="Автоматично створювати відсутні FAQ"
PLG_SYSTEM_AIMARKDOWN_AUTO_GENERATE_FAQ_DESC="Якщо товар не має власного розділу FAQ, автоматично створюються доречні запитання й відповіді (гарантія, калібрування, доставка, застосування)."
PLG_SYSTEM_AIMARKDOWN_PRIORITIZE_PDFS_LABEL="Виділяти PDF для завантаження"
PLG_SYSTEM_AIMARKDOWN_PRIORITIZE_PDFS_DESC="Знаходить усі посилання на PDF (технічні характеристики, інструкції, каталоги), перетворює їх на абсолютні URL і виводить в окремому розділі «Завантаження & документація»."
PLG_SYSTEM_AIMARKDOWN_UNROLL_TABS_ACCORDIONS_LABEL="Розгортати вкладки & акордеони"
PLG_SYSTEM_AIMARKDOWN_UNROLL_TABS_ACCORDIONS_DESC="Розгортає приховані вкладки та згорнуті акордеони в послідовні заголовки й розділи Markdown для агентів ШІ."
PLG_SYSTEM_AIMARKDOWN_ENABLE_CACHE_LABEL="Увімкнути кеш Markdown"
PLG_SYSTEM_AIMARKDOWN_ENABLE_CACHE_DESC="Зберігає перетворені файли Markdown у кеші, щоб віддавати їх агентам ШІ за мілісекунди та зменшити навантаження на сервер."
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_LABEL="Час життя кешу"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_DESC="Як довго файли Markdown у кеші залишаються дійсними до повторного створення."
