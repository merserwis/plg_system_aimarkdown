PLG_SYSTEM_AIMARKDOWN_LLMS_EXCLUDE_URLS_DESC="Zadejte URL nebo cesty, které se nemají objevit v /llms.txt, jednu na řádek (např. /koszyk, /polityka-prywatnosci, /logowanie)."
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_LABEL="Řadit položky podle"
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_DESC="Zvolte, jak se v /llms.txt určuje pořadí produktů a článků. Důrazně doporučeno: nejoblíbenější (zobrazení)."
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_OPT_HITS="Nejoblíbenější (podle zobrazení)"
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_OPT_DATE="Nejnovější první (podle ID / data)"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_LABEL="Max. počet produktů / stránek v /llms.txt"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_DESC="Omezí počet položek, aby nebyl překročen limit kontextového okna LLM. llmstxt.org doporučuje 500–1000."
PLG_SYSTEM_AIMARKDOWN_LLMS_DESC_LENGTH_LABEL="Délka popisu"
PLG_SYSTEM_AIMARKDOWN_LLMS_DESC_LENGTH_DESC="Maximální délka popisu v /llms.txt (znaky). Delší popisy se zkrátí za posledním celým slovem a končí „…“."
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_500="Prvních 500 položek (doporučeno pro AI)"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_750="Prvních 750 položek"
