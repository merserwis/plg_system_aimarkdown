PLG_SYSTEM_AIMARKDOWN_MERCHANT_SCOPE_DESC="Die Händlerdaten im Front Matter, der Hinweis über dem Inhalt und der Aufruf darunter: auf jeder Seite oder nur bei Produkten. Die Texte dieser Hinweise sprechen meist vom „Gerät“, seinem Code und Preis — auf einer Kontaktseite oder in einem Artikel ergeben sie keinen Sinn."
