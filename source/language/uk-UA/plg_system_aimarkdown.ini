PLG_SYSTEM_AIMARKDOWN_SHOW_CUSTOM_FIELDS_DESC="Показує додаткові поля та технічні характеристики товарів із Balbooa Gridbox."
PLG_SYSTEM_AIMARKDOWN_SHOW_ALTERNATE_LINK_LABEL="Показувати альтернативне посилання"
PLG_SYSTEM_AIMARKDOWN_SHOW_ALTERNATE_LINK_DESC="Додає заголовок Link за RFC 8288 і тег посилання rel=alternate у розділ head сторінки HTML."
PLG_SYSTEM_AIMARKDOWN_SERVICE_DOC_PATH_LABEL="Шлях до сервісної документації"
PLG_SYSTEM_AIMARKDOWN_SERVICE_DOC_PATH_DESC="Шлях (відносно кореня сайту), що оголошується в заголовку Link як rel=\"service-doc\", наприклад сторінка контактів або «про нас». Порожньо = не додавати. Попередні версії завжди оголошували /kontakt."
PLG_SYSTEM_AIMARKDOWN_ENABLE_LLMSTXT_LABEL="Увімкнути генератор /llms.txt"
PLG_SYSTEM_AIMARKDOWN_ENABLE_LLMSTXT_DESC="Автоматично створює та підтримує стандартизований файл /llms.txt у кореневому каталозі сайту відповідно до https://llmstxt.org."
