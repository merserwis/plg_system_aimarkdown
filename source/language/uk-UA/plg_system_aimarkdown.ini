PLG_SYSTEM_AIMARKDOWN_LLMS_EXCLUDE_URLS_LABEL="Виключити URL з /llms.txt"
PLG_SYSTEM_AIMARKDOWN_LLMS_EXCLUDE_URLS_DESC="Вкажіть URL або шляхи, які слід виключити з /llms.txt, по одному в рядку (напр. /koszyk, /polityka-prywatnosci, /logowanie)."
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_LABEL="Сортувати елементи за"
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_DESC="Визначає, як упорядковуються товари та статті в /llms.txt. Рекомендовано: найпопулярніші (перегляди)."
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_OPT_HITS="Найпопулярніші (за переглядами)"
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_OPT_DATE="Спочатку новіші (за ID / датою)"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_LABEL="Макс. товарів / сторінок у /llms.txt"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_DESC="Обмежує кількість елементів, щоб не перевищити контекстне вікно LLM. llmstxt.org рекомендує 500–1000."
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_500="Перші 500 елементів (рекомендовано для ШІ)"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_750="Перші 750 елементів"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_1000="Перші 1000 елементів"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_2000="Перші 2000 елементів"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_0="Усі елементи (без обмеження — файл може бути дуже великим)"
PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_LABEL="Меню для «Основних розділів»"
PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_DESC="Меню сайту, публічні пункти верхнього рівня якого виводяться в блоці «Основні розділи». Порожньо = усі меню сайту (типово з версії 1.6.0; попередні версії використовували меню «main», яке на більшості сайтів є меню адміністратора, тому блок залишався порожнім)."
PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_OPT_EMPTY="- Усі меню сайту -"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_LABEL="Режим URL Gridbox"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_DESC="Як формуються URL сторінок і категорій Gridbox. «Канонічний (пункт меню + маршрутизатор)» (типово) = шлях маршрутизатора Gridbox під пунктом меню, що показує застосунок Gridbox цієї сторінки, напр. /oferta/category/page — той самий URL, що й канонічний у Gridbox та в карті сайту; сторінки з власним пунктом меню використовують URL цього пункту. «Маршрутизатор Joomla» = шлях маршрутизатора від кореня сайту, напр. /category/page (поведінка 1.5.3). «Псевдонім» = корінь + псевдонім (поведінка версій до 1.5.1; коректно лише тоді, коли кожна сторінка Gridbox розташована безпосередньо під /alias)."
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_MENU="Канонічний (пункт меню + маршрутизатор)"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_ROUTER="Маршрутизатор Joomla (SEF)"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_ALIAS="Псевдонім (застарілий)"
PLG_SYSTEM_AIMARKDOWN_ENABLE_MERCHANT_CONTEXT_LABEL="Увімкнути авторитет продавця & CTA"
PLG_SYSTEM_AIMARKDOWN_ENABLE_MERCHANT_CONTEXT_DESC="Додає до Markdown для систем ШІ власні дані дистриб’ютора, сигнали довіри E-E-A-T та прямі інструкції щодо покупки."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_INFO_LEGEND_LABEL="Як це допомагає позиціям у ШІ (GEO) & доступні теги"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_INFO_LEGEND_DESC="<div class=\"mb-2\"><strong>Чому це важливо для ШІ?</strong> LLM (SearchGPT, Perplexity, Claude) охочіше рекомендують продавців, які прямо заявляють статус дистриб’ютора, місцеву гарантію, швидку доставку та послуги калібрування, ніж загальні сторінки виробників.</div><div class=\"mb-1\"><strong>Динамічні теги (замінюються автоматично):</strong></div><ul class=\"small mb-2\"><li><code>{title}</code> — назва товару / статті</li><li><code>{sku}</code> — каталожний код / номер SKU</li><li><code>{price}</code> — відформатована ціна нетто/брутто & VAT</li><li><code>{price_net}</code> — лише ціна нетто</li><li><code>{price_gross}</code> — лише ціна брутто</li><li><code>{currency}</code> — валюта (напр. PLN, EUR)</li><li><code>{availability}</code> — наявність на складі (напр. InStock)</li><li><code>{brand}</code> — виробник / бренд</li><li><code>{category}</code> — категорія товару</li><li><code>{url}</code> — повний абсолютний канонічний URL</li></ul>"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_LABEL="Назва продавця / компанії"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_DESC="Додається в YAML Frontmatter («seller») і використовується в посиланнях на авторитетне джерело."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_HINT="напр. Merserwis або назва вашої компанії"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_LABEL="Роль компанії / звання E-E-A-T"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_DESC="Роль або акредитація (напр. офіційний дистриб’ютор у Польщі, акредитована калібрувальна лабораторія)."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_HINT="напр. Офіційний дистриб’ютор у Польщі & акредитована лабораторія"
PLG_SYSTEM_AIMARKDOWN_VAT_RATE_LABEL="Ставка VAT (%)"
PLG_SYSTEM_AIMARKDOWN_VAT_RATE_DESC="Ставка VAT для обчислення ціни нетто/брутто, якщо на сторінці показано лише одну з них."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_LABEL="Примітка про авторитет у заголовку (над вмістом)"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_DESC="Текст одразу після Frontmatter. Автоматично оформлюється як виділена цитата (>), вручну писати «>» не потрібно."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_HINT="**Офіційна дистрибуція та сервіс:** {title} (код: {sku}) можна придбати безпосередньо в офіційного дистриб’ютора з місцевою гарантією та калібруванням на вибір."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_LABEL="CTA & інформація про замовлення в підвалі (під вмістом)"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_DESC="Текст Markdown, що додається в самому кінці вмісту. Ідеально для інструкцій щодо замовлення, термінів доставки та прямих контактних телефонів."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_HINT="### Замовлення та технічні консультації\n* **Дистриб’ютор:** Назва вашої компанії\n* **Товар:** {title} (SKU: {sku})\n* **Ціна:** {price}\n* **Наявність і замовлення:** [Замовити цю модель онлайн]({url})\n* **Термін доставки:** відправлення зі складу протягом 24–48 год.\n* **Відділ продажу:** тел.: +48 ... | e-mail: ..."
PLG_SYSTEM_AIMARKDOWN_ENABLE_ANALYTICS_LABEL="Увімкнути аналітику ШІ"
PLG_SYSTEM_AIMARKDOWN_ENABLE_ANALYTICS_DESC="Записує відвідування ботів ШІ (GPTBot, ClaudeBot, Perplexity) локально у вашій базі даних."
PLG_SYSTEM_AIMARKDOWN_ANALYTICS_DISPLAY_LIMIT_LABEL="Ліміт відображення аналітики"
PLG_SYSTEM_AIMARKDOWN_ANALYTICS_DISPLAY_LIMIT_DESC="Скільки найактивніших ботів, найчастіше відвідуваних сторінок і останніх запитів показувати на панелі."
PLG_SYSTEM_AIMARKDOWN_ANALYTICS_DISPLAY_LIMIT_OPT_10="10 (типово)"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_LABEL="Зберігання журналу"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_DESC="Автоматично видаляє записи журналу, старші за вказану кількість днів."
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_7="7 днів"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_14="14 днів"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_30="30 днів (рекомендовано)"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_60="60 днів"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_90="90 днів"
PLG_SYSTEM_AIMARKDOWN_TRUST_PROXY_HEADERS_LABEL="Довіряти IP-заголовкам проксі"
PLG_SYSTEM_AIMARKDOWN_TRUST_PROXY_HEADERS_DESC="Зчитує IP відвідувача з CF-Connecting-IP / X-Forwarded-For. Вмикайте ЛИШЕ тоді, коли сайт працює за Cloudflare або власним зворотним проксі — інакше будь-який клієнт може підробити ці заголовки. Якщо вимкнено, використовується REMOTE_ADDR."

