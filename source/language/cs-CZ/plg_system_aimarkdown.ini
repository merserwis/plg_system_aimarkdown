PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_LABEL="Uchovávání protokolu"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_DESC="Automaticky maže záznamy protokolu starší než zadaný počet dní."
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_7="7 dní"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_14="14 dní"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_30="30 dní (doporučeno)"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_60="60 dní"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_90="90 dní"
PLG_SYSTEM_AIMARKDOWN_TRUST_PROXY_HEADERS_LABEL="Důvěřovat IP hlavičkám proxy"
PLG_SYSTEM_AIMARKDOWN_TRUST_PROXY_HEADERS_DESC="Čte IP návštěvníka z CF-Connecting-IP / X-Forwarded-For. Zapněte POUZE tehdy, když je web za Cloudflare nebo za vaší vlastní reverzní proxy – jinak může tyto hlavičky podvrhnout kterýkoli klient. Při vypnutí se použije REMOTE_ADDR."

