PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_0="Wszystkie pozycje (bez limitu – plik może być bardzo duży)"
PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_LABEL="Menu dla „Głównych sekcji”"
PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_DESC="Menu witryny, którego publiczne pozycje najwyższego poziomu trafiają do bloku „Główne sekcje”. Puste = wszystkie menu witryny (domyślnie od 1.6.0; wcześniejsze wersje używały menu „main”, które w większości witryn jest menu administratora, więc blok pozostawał pusty)."
PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_OPT_EMPTY="- Wszystkie menu witryny -"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_LABEL="Tryb adresów Gridbox"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_DESC="Sposób budowania adresów stron i kategorii Gridbox. „Kanoniczny (pozycja menu + router)” (domyślnie) = ścieżka routera Gridbox pod pozycją menu wyświetlającą aplikację Gridbox danej strony, np. /oferta/kategoria/strona — ten sam adres co kanoniczny Gridbox i mapa witryny; strony z własną pozycją menu używają jej adresu. „Router Joomla” = ścieżka routera od katalogu głównego witryny, np. /kategoria/strona (zachowanie wersji 1.5.3). „Alias” = katalog główny + alias (zachowanie wersji do 1.5.1; poprawne tylko, gdy każda strona Gridbox leży bezpośrednio pod /alias)."
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_MENU="Kanoniczny (pozycja menu + router)"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_ROUTER="Router Joomla (SEF)"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_ALIAS="Alias (starszy)"
PLG_SYSTEM_AIMARKDOWN_ENABLE_MERCHANT_CONTEXT_LABEL="Włącz wiarygodność sprzedawcy i CTA"
PLG_SYSTEM_AIMARKDOWN_ENABLE_MERCHANT_CONTEXT_DESC="Dodaje do Markdown dla wyszukiwarek AI własne dane dystrybutora, sygnały zaufania E-E-A-T i bezpośrednie instrukcje zakupu."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_INFO_LEGEND_LABEL="Jak to poprawia pozycję w AI (GEO) i dostępne znaczniki"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_INFO_LEGEND_DESC="<div class=\"mb-2\"><strong>Dlaczego to ważne dla AI?</strong> LLM (SearchGPT, Perplexity, Claude) chętniej polecają sprzedawców, którzy wprost deklarują status dystrybutora, lokalną gwarancję, szybką dostawę i usługi wzorcowania, niż ogólne strony producentów.</div><div class=\"mb-1\"><strong>Znaczniki dynamiczne (zastępowane automatycznie):</strong></div><ul class=\"small mb-2\"><li><code>{title}</code> - nazwa produktu / tytuł artykułu</li><li><code>{sku}</code> - kod katalogowy / numer SKU</li><li><code>{price}</code> - sformatowana cena netto/brutto z VAT</li><li><code>{price_net}</code> - tylko cena netto</li><li><code>{price_gross}</code> - tylko cena brutto</li><li><code>{currency}</code> - waluta (np. PLN, EUR)</li><li><code>{availability}</code> - stan magazynowy (np. InStock)</li><li><code>{brand}</code> - producent / marka</li><li><code>{category}</code> - kategoria produktu</li><li><code>{url}</code> - pełny bezwzględny adres kanoniczny</li></ul>"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_LABEL="Nazwa sprzedawcy / firmy"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_DESC="Wstawiana do YAML Frontmatter („seller”) i używana w cytowaniach budujących wiarygodność."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_HINT="np. Merserwis lub nazwa Twojej firmy"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_LABEL="Rola firmy / tytuł E-E-A-T"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_DESC="Rola lub tytuł akredytacji (np. oficjalny dystrybutor w Polsce, akredytowane laboratorium wzorcujące)."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_HINT="np. Oficjalny dystrybutor w Polsce i akredytowane laboratorium"
PLG_SYSTEM_AIMARKDOWN_VAT_RATE_LABEL="Stawka VAT (%)"
PLG_SYSTEM_AIMARKDOWN_VAT_RATE_DESC="Stawka VAT służąca do wyliczenia ceny netto/brutto, gdy na stronie podana jest tylko jedna z nich."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_LABEL="Notka wiarygodności w nagłówku (nad treścią)"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_DESC="Tekst wstawiany zaraz po Frontmatter. Automatycznie formatowany jako wyróżniony cytat (>), nie trzeba ręcznie wpisywać „>”."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_HINT="**Oficjalna dystrybucja i serwis:** {title} (kod: {sku}) jest dostępny bezpośrednio u oficjalnego dystrybutora, z lokalną gwarancją i opcjonalnym wzorcowaniem."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_LABEL="CTA i informacje o zamawianiu w stopce (pod treścią)"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_DESC="Tekst Markdown dołączany na samym końcu treści. Idealny na instrukcje zamawiania, czas dostawy i bezpośrednie numery kontaktowe."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_HINT="### Zamówienia i doradztwo techniczne\n* **Dystrybutor:** Nazwa Twojej firmy\n* **Produkt:** {title} (SKU: {sku})\n* **Cena:** {price}\n* **Dostępność i zamówienia:** [Zamów ten model online]({url})\n* **Czas dostawy:** wysyłka z magazynu w ciągu 24–48 h.\n* **Kontakt handlowy:** tel. +48 ... | e-mail: ..."
PLG_SYSTEM_AIMARKDOWN_ENABLE_ANALYTICS_LABEL="Włącz analitykę AI"
PLG_SYSTEM_AIMARKDOWN_ENABLE_ANALYTICS_DESC="Zapisuje wizyty botów AI (GPTBot, ClaudeBot, Perplexity) lokalnie w Twojej bazie danych."
PLG_SYSTEM_AIMARKDOWN_ANALYTICS_DISPLAY_LIMIT_LABEL="Limit wyświetlania analityki"
PLG_SYSTEM_AIMARKDOWN_ANALYTICS_DISPLAY_LIMIT_DESC="Ile najaktywniejszych botów, najczęściej odwiedzanych stron i ostatnich zapytań pokazywać w panelu."
PLG_SYSTEM_AIMARKDOWN_ANALYTICS_DISPLAY_LIMIT_OPT_10="10 (domyślnie)"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_LABEL="Przechowywanie logów"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_DESC="Automatycznie usuwa logi starsze niż podana liczba dni."
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_7="7 dni"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_14="14 dni"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_30="30 dni (zalecane)"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_60="60 dni"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_90="90 dni"
PLG_SYSTEM_AIMARKDOWN_TRUST_PROXY_HEADERS_LABEL="Ufaj nagłówkom IP z proxy"
PLG_SYSTEM_AIMARKDOWN_TRUST_PROXY_HEADERS_DESC="Odczytuje IP odwiedzającego z CF-Connecting-IP / X-Forwarded-For. Włącz TYLKO, gdy witryna działa za Cloudflare lub własnym odwrotnym proxy – w przeciwnym razie każdy klient może podrobić te nagłówki. Po wyłączeniu używany jest REMOTE_ADDR."

