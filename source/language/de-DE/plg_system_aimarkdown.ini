PLG_SYSTEM_AIMARKDOWN_XML_DESCRIPTION="Natives Markdown-Plugin für Joomla 6 und PHP 8.5 mit llmstxt.org-Generator, B2B-Preisankern, Caching, YAML-Frontmatter, hybriden FAQ und KI-Analytik."

