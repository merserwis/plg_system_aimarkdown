PLG_SYSTEM_AIMARKDOWN_ENABLE_FRONTMATTER_LABEL="Enable YAML Frontmatter"
PLG_SYSTEM_AIMARKDOWN_ENABLE_FRONTMATTER_DESC="Prepend structured YAML metadata (title, price, B2B net/gross, SKU, availability, category, downloads, seller) at the top of the Markdown for LLMs."
PLG_SYSTEM_AIMARKDOWN_ENABLE_FAQ_LABEL="Enable Product FAQ Section"
PLG_SYSTEM_AIMARKDOWN_ENABLE_FAQ_DESC="Include structured FAQ in Markdown. Prioritizes custom FAQPage Schema/details from description; auto-generates contextual Q&A if missing."
PLG_SYSTEM_AIMARKDOWN_AUTO_GENERATE_FAQ_LABEL="Auto-generate Missing FAQs"
PLG_SYSTEM_AIMARKDOWN_AUTO_GENERATE_FAQ_DESC="If a product lacks a custom FAQ section, automatically generate smart Q&A (warranty, calibration, delivery, applications)."
PLG_SYSTEM_AIMARKDOWN_PRIORITIZE_PDFS_LABEL="Prioritize PDF Downloads"
PLG_SYSTEM_AIMARKDOWN_PRIORITIZE_PDFS_DESC="Extract all PDF links (datasheets, manuals, catalogs), convert them to absolute URLs, and list them under a dedicated 'Downloads & Documentation' section."
PLG_SYSTEM_AIMARKDOWN_UNROLL_TABS_ACCORDIONS_LABEL="Extract Tabs & Accordions"
PLG_SYSTEM_AIMARKDOWN_UNROLL_TABS_ACCORDIONS_DESC="Unroll hidden tabs and collapsed accordions into clean sequential Markdown headings and sections for AI agents."
PLG_SYSTEM_AIMARKDOWN_ENABLE_CACHE_LABEL="Enable Markdown Cache"
PLG_SYSTEM_AIMARKDOWN_ENABLE_CACHE_DESC="Store converted Markdown files in cache to serve AI agents in milliseconds and reduce server load."
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_LABEL="Cache Lifetime"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_DESC="How long cached Markdown files should remain valid before regenerating."
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_3600="1 Hour"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_21600="6 Hours"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_43200="12 Hours"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_86400="24 Hours (Recommended)"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_604800="7 Days"
PLG_SYSTEM_AIMARKDOWN_EXTRA_QUERY_PARAMS_LABEL="Extra query parameters"
PLG_SYSTEM_AIMARKDOWN_EXTRA_QUERY_PARAMS_DESC="Query parameters that change the content of a page on your site and must stay in the Markdown URL and the cache key, separated by commas (e.g. filter_brand, sort). Joomla and Gridbox routing, pagination, search and filters are always kept; other parameters (utm_*, fbclid, random values) are ignored so they cannot fill the cache."
PLG_SYSTEM_AIMARKDOWN_CUSTOM_EXCLUDE_SELECTORS_LABEL="Custom Exclude Selectors"
PLG_SYSTEM_AIMARKDOWN_CUSTOM_EXCLUDE_SELECTORS_DESC="Enter one selector per line to strip matching elements from Markdown. Supported formats:<br>• CSS Class: .promo-banner, .newsletter-popup<br>• CSS ID: #live-chat, #cookie-bar<br>• HTML Tag: aside, dialog<br>• Tag with Class: div.popup, section.advert<br>• XPath: //div[@data-banner='true']"
PLG_SYSTEM_AIMARKDOWN_SHOW_CATEGORY_LABEL="Show Category"
PLG_SYSTEM_AIMARKDOWN_SHOW_CATEGORY_DESC="Display the post or product category in the generated Markdown."
PLG_SYSTEM_AIMARKDOWN_SHOW_TAGS_LABEL="Show Tags"
PLG_SYSTEM_AIMARKDOWN_SHOW_TAGS_DESC="Display tags in the generated Markdown."
PLG_SYSTEM_AIMARKDOWN_SHOW_AUTHOR_LABEL="Show Author"
PLG_SYSTEM_AIMARKDOWN_SHOW_AUTHOR_DESC="Display the author in the generated Markdown."
PLG_SYSTEM_AIMARKDOWN_SHOW_DATE_LABEL="Show Date"
PLG_SYSTEM_AIMARKDOWN_SHOW_DATE_DESC="Display the publication date in the generated Markdown."
PLG_SYSTEM_AIMARKDOWN_SHOW_DESCRIPTION_LABEL="Show Description"
PLG_SYSTEM_AIMARKDOWN_SHOW_DESCRIPTION_DESC="Display the main post or product description in the generated Markdown."
PLG_SYSTEM_AIMARKDOWN_SHOW_IMAGES_LABEL="Show Images"
PLG_SYSTEM_AIMARKDOWN_SHOW_IMAGES_DESC="Include images in the generated Markdown."
PLG_SYSTEM_AIMARKDOWN_SHOW_CUSTOM_FIELDS_LABEL="Show Custom Fields"
PLG_SYSTEM_AIMARKDOWN_SHOW_CUSTOM_FIELDS_DESC="Display custom fields and product technical specifications from Balbooa Gridbox."
PLG_SYSTEM_AIMARKDOWN_SHOW_ALTERNATE_LINK_LABEL="Show Alternate Link"
PLG_SYSTEM_AIMARKDOWN_SHOW_ALTERNATE_LINK_DESC="Add the RFC 8288 Link header and the rel=alternate link tag in the HTML head section."
PLG_SYSTEM_AIMARKDOWN_SERVICE_DOC_PATH_LABEL="Service Documentation Path"
PLG_SYSTEM_AIMARKDOWN_SERVICE_DOC_PATH_DESC="Path (relative to the site root) announced in the Link header as rel=\"service-doc\", e.g. your contact or 'about' page. Leave empty to omit. Previous versions always announced /kontakt."
PLG_SYSTEM_AIMARKDOWN_ENABLE_LLMSTXT_LABEL="Enable /llms.txt Generator"
PLG_SYSTEM_AIMARKDOWN_ENABLE_LLMSTXT_DESC="Automatically generates and maintains a standardized /llms.txt file in the site root directory according to https://llmstxt.org."
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_LABEL="Site / Project Title (H1)"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_DESC="The main title displayed at the top of /llms.txt. Empty = the Site Name from Global Configuration."
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_HINT="e.g. Merserwis - Measurement Instrumentation & Calibration"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_LABEL="Short Summary Blockquote (>)"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_DESC="A concise 2-3 sentence overview of the company, accreditation, and offering for LLMs."
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_HINT="e.g. Official distributor of testing equipment in Poland. Electrical safety meters, EVSE testing, power quality analyzers, and calibration services."
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_LABEL="Auto-generation Interval"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_DESC="Time interval between automated background regenerations of the /llms.txt file."
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_OPT_43200="Every 12 Hours"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_OPT_86400="Every 24 Hours (Daily)"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_OPT_432000="Every 5 Days"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_OPT_1296000="Every 15 Days"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_OPT_2592000="Every 30 Days (Monthly)"
PLG_SYSTEM_AIMARKDOWN_LLMS_EXCLUDE_URLS_LABEL="Exclude URLs from /llms.txt"
PLG_SYSTEM_AIMARKDOWN_LLMS_EXCLUDE_URLS_DESC="Enter URLs or paths to exclude from /llms.txt, one per line (e.g. /koszyk, /polityka-prywatnosci, /logowanie)."
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_LABEL="Sort Items By"
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_DESC="Choose how products and articles are prioritized in /llms.txt. Highly recommended: Most Popular (Hits)."
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_OPT_HITS="Most Popular (By Views / Hits)"
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_OPT_DATE="Newest First (By ID / Date)"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_LABEL="Max Products / Pages in /llms.txt"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_DESC="Limit items to prevent exceeding LLM context window limits. 500-1000 is recommended by llmstxt.org."
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_500="Top 500 items (Recommended for AI)"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_750="Top 750 items"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_1000="Top 1000 items"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_2000="Top 2000 items"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_0="All Items (No Limit - May create very large file)"
PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_LABEL="Menu for 'Main sections'"
PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_DESC="Site menu whose public top-level items are listed in the 'Main sections' block. Empty = all site menus (the default since 1.6.0; earlier versions used the menu 'main', which on most sites is the administrator menu, so the block stayed empty)."
PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_OPT_EMPTY="- All site menus -"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_LABEL="Gridbox URL Mode"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_DESC="How Gridbox page/category URLs are built. 'Canonical (menu item + router)' (default) = the Gridbox router path placed under the menu item that shows the page's Gridbox app, e.g. /oferta/category/page, the same URL as the Gridbox canonical and sitemap; pages with their own menu item use that item's URL. 'Joomla Router' = router path from the site root, e.g. /category/page (behaviour of 1.5.3). 'Alias' = root + alias (behaviour of versions up to 1.5.1; only correct when every Gridbox page lives directly under /alias)."
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_MENU="Canonical (menu item + router)"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_ROUTER="Joomla Router (SEF)"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_ALIAS="Alias (legacy)"
PLG_SYSTEM_AIMARKDOWN_ENABLE_MERCHANT_CONTEXT_LABEL="Enable Merchant Authority & CTA"
PLG_SYSTEM_AIMARKDOWN_ENABLE_MERCHANT_CONTEXT_DESC="Inject custom distributor credentials, E-E-A-T trust signals, and direct purchase instructions into Markdown for AI engines."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_INFO_LEGEND_LABEL="How this helps your AI Rankings (GEO) & Available Tags"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_INFO_LEGEND_DESC="<div class=\"mb-2\"><strong>Why is this crucial for AI?</strong> LLMs (SearchGPT, Perplexity, Claude) prefer recommending merchants who explicitly declare distributor status, local warranty, fast delivery, and calibration services rather than generic manufacturer pages.</div><div class=\"mb-1\"><strong>Dynamic Tags Legend (Automatically replaced):</strong></div><ul class=\"small mb-2\"><li><code>{title}</code> - Product / Article Title</li><li><code>{sku}</code> - Catalog Code / SKU Number</li><li><code>{price}</code> - Formatted Price with Net/Gross & VAT</li><li><code>{price_net}</code> - Net Price only</li><li><code>{price_gross}</code> - Gross Price only</li><li><code>{currency}</code> - Currency (e.g. PLN, EUR)</li><li><code>{availability}</code> - Stock Status (e.g. InStock)</li><li><code>{brand}</code> - Manufacturer / Brand Name</li><li><code>{category}</code> - Product Category</li><li><code>{url}</code> - Full Absolute Canonical URL</li></ul>"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_LABEL="Merchant / Company Name"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_DESC="Injected into YAML Frontmatter ('seller') and used for authority citations."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_HINT="e.g. Merserwis or your company name"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_LABEL="Business Role / E-E-A-T Title"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_DESC="Role or accreditation title (e.g. Official Polish Distributor, Accredited Calibration Laboratory)."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_HINT="e.g. Official Polish Distributor & Accredited Laboratory"
PLG_SYSTEM_AIMARKDOWN_VAT_RATE_LABEL="VAT Rate (%)"
PLG_SYSTEM_AIMARKDOWN_VAT_RATE_DESC="VAT rate used to derive net/gross prices when only one of them is shown on the page."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_LABEL="Header Authority Note (Above Content)"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_DESC="Text placed immediately after Frontmatter. Automatically formatted as a highlighted callout blockquote (>), no need to write '>' manually."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_HINT="**Official distribution and service:** {title} (code: {sku}) is available directly from the official distributor, with local warranty and optional calibration."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_LABEL="Footer CTA & Ordering Info (Below Content)"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_DESC="Markdown text appended at the very end of the content. Ideal for order instructions, delivery times, and direct contact numbers."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_HINT="### Orders and technical advice\n* **Distributor:** Your Company Name\n* **Product:** {title} (SKU: {sku})\n* **Price:** {price}\n* **Availability and orders:** [Order this model online]({url})\n* **Delivery time:** Shipped from stock within 24-48 h.\n* **Sales contact:** Call: +48 ... | E-mail: ..."
PLG_SYSTEM_AIMARKDOWN_ENABLE_ANALYTICS_LABEL="Enable AI Analytics"
PLG_SYSTEM_AIMARKDOWN_ENABLE_ANALYTICS_DESC="Log visits from AI bots (GPTBot, ClaudeBot, Perplexity) locally in your database."
PLG_SYSTEM_AIMARKDOWN_ANALYTICS_DISPLAY_LIMIT_LABEL="Analytics Display Limit"
PLG_SYSTEM_AIMARKDOWN_ANALYTICS_DISPLAY_LIMIT_DESC="Select how many top bots, top visited pages, and recent requests to display in the dashboard."
PLG_SYSTEM_AIMARKDOWN_ANALYTICS_DISPLAY_LIMIT_OPT_10="10 (Default)"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_LABEL="Log Retention"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_DESC="Automatically purge logs older than specified number of days."
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_7="7 Days"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_14="14 Days"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_30="30 Days (Recommended)"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_60="60 Days"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_90="90 Days"
PLG_SYSTEM_AIMARKDOWN_TRUST_PROXY_HEADERS_LABEL="Trust Proxy IP Headers"
PLG_SYSTEM_AIMARKDOWN_TRUST_PROXY_HEADERS_DESC="Read the visitor IP from CF-Connecting-IP / X-Forwarded-For. Enable ONLY when the site is behind Cloudflare or your own reverse proxy - otherwise any client can forge these headers. When disabled, REMOTE_ADDR is used."

