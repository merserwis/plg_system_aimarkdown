PLG_SYSTEM_AIMARKDOWN_ENABLE_FAQ_LABEL="FAQ-sectie voor producten inschakelen"
PLG_SYSTEM_AIMARKDOWN_ENABLE_FAQ_DESC="Neemt een gestructureerde FAQ op in de Markdown. Gebruikt bij voorkeur een eigen FAQPage-schema of details-blokken uit de beschrijving; ontbreken die, dan worden passende vragen en antwoorden gemaakt."
PLG_SYSTEM_AIMARKDOWN_AUTO_GENERATE_FAQ_LABEL="Ontbrekende FAQ's automatisch maken"
PLG_SYSTEM_AIMARKDOWN_AUTO_GENERATE_FAQ_DESC="Heeft een product geen eigen FAQ-sectie, dan worden automatisch slimme vragen en antwoorden gemaakt (garantie, kalibratie, levering, toepassingen)."
PLG_SYSTEM_AIMARKDOWN_PRIORITIZE_PDFS_LABEL="PDF-downloads voorrang geven"
PLG_SYSTEM_AIMARKDOWN_PRIORITIZE_PDFS_DESC="Haalt alle PDF-links op (datasheets, handleidingen, catalogi), zet ze om naar absolute URL's en toont ze in een aparte sectie 'Downloads en documentatie'."
PLG_SYSTEM_AIMARKDOWN_UNROLL_TABS_ACCORDIONS_LABEL="Tabbladen en accordeons uitklappen"
PLG_SYSTEM_AIMARKDOWN_UNROLL_TABS_ACCORDIONS_DESC="Klapt verborgen tabbladen en dichtgeklapte accordeons uit tot overzichtelijke, opeenvolgende Markdown-koppen en -secties voor AI-agents."
PLG_SYSTEM_AIMARKDOWN_ENABLE_CACHE_LABEL="Markdown-cache inschakelen"
PLG_SYSTEM_AIMARKDOWN_ENABLE_CACHE_DESC="Bewaart omgezette Markdown-bestanden in de cache, zodat AI-agents binnen milliseconden antwoord krijgen en de server minder belast wordt."
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_LABEL="Cacheduur"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_DESC="Hoe lang Markdown-bestanden in de cache geldig blijven voordat ze opnieuw worden gemaakt."
