PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_LABEL="Nabídka pro „Hlavní sekce“"
PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_DESC="Nabídka webu, jejíž veřejné položky nejvyšší úrovně se vypíší v bloku „Hlavní sekce“. Prázdné = všechny nabídky webu (výchozí od verze 1.6.0; dřívější verze používaly nabídku „main“, což je na většině webů nabídka administrace, takže blok zůstával prázdný)."
PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_OPT_EMPTY="- Všechny nabídky webu -"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_LABEL="Režim URL Gridboxu"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_DESC="Způsob sestavení URL stránek a kategorií Gridboxu. „Kanonický (položka nabídky + router)“ (výchozí) = cesta routeru Gridboxu umístěná pod položkou nabídky, která zobrazuje aplikaci Gridboxu dané stránky, např. /oferta/kategorie/stranka, stejná URL jako kanonická adresa Gridboxu a mapa webu; stránky s vlastní položkou nabídky použijí URL této položky. „Router Joomly“ = cesta routeru od kořene webu, např. /kategorie/stranka (chování verze 1.5.3). „Alias“ = kořen + alias (chování verzí do 1.5.1; správné jen tehdy, když každá stránka Gridboxu leží přímo pod /alias)."
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_MENU="Kanonický (položka nabídky + router)"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_ROUTER="Router Joomly (SEF)"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_ALIAS="Alias (starší režim)"
PLG_SYSTEM_AIMARKDOWN_ENABLE_MERCHANT_CONTEXT_LABEL="Zapnout autoritu prodejce a výzvu k akci"
PLG_SYSTEM_AIMARKDOWN_ENABLE_MERCHANT_CONTEXT_DESC="Vloží do Markdownu pro AI vyhledávače vaše údaje distributora, signály důvěryhodnosti E-E-A-T a pokyny k přímému nákupu."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_INFO_LEGEND_LABEL="Jak to pomáhá vašemu postavení v AI (GEO) a dostupné značky"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_INFO_LEGEND_DESC="<div class=\"mb-2\"><strong>Proč je to pro AI zásadní?</strong> LLM (SearchGPT, Perplexity, Claude) raději doporučují prodejce, kteří výslovně uvádějí status distributora, místní záruku, rychlé dodání a kalibrační služby, než obecné stránky výrobců.</div><div class=\"mb-1\"><strong>Přehled dynamických značek (nahrazují se automaticky):</strong></div><ul class=\"small mb-2\"><li><code>{title}</code> - Název produktu / článku</li><li><code>{sku}</code> - Katalogové číslo / SKU</li><li><code>{price}</code> - Formátovaná cena bez DPH/s DPH a sazba DPH</li><li><code>{price_net}</code> - Pouze cena bez DPH</li><li><code>{price_gross}</code> - Pouze cena s DPH</li><li><code>{currency}</code> - Měna (např. PLN, EUR)</li><li><code>{availability}</code> - Stav skladu (např. InStock)</li><li><code>{brand}</code> - Výrobce / značka</li><li><code>{category}</code> - Kategorie produktu</li><li><code>{url}</code> - Úplná absolutní kanonická URL</li></ul>"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_LABEL="Název prodejce / firmy"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_DESC="Vkládá se do YAML Frontmatter („seller“) a používá se pro citace autority."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_HINT="např. Merserwis nebo název vaší firmy"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_LABEL="Obchodní role / titul E-E-A-T"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_DESC="Role nebo akreditace (např. oficiální distributor pro Polsko, akreditovaná kalibrační laboratoř)."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_HINT="např. Oficiální distributor pro Polsko a akreditovaná laboratoř"
PLG_SYSTEM_AIMARKDOWN_VAT_RATE_LABEL="Sazba DPH (%)"
PLG_SYSTEM_AIMARKDOWN_VAT_RATE_DESC="Sazba DPH pro výpočet ceny bez DPH nebo s DPH (nepoužívá se u „Konečná cena“)."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_LABEL="Poznámka o autoritě v záhlaví (nad obsahem)"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_DESC="Text vložený hned za Frontmatter. Automaticky se naformátuje jako zvýrazněná citace (>), znak „>“ není třeba psát ručně."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_HINT="**Oficiální distribuce a servis:** {title} (kód: {sku}) je k dispozici přímo u oficiálního distributora, s místní zárukou a volitelnou kalibrací."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_LABEL="Výzva k akci a informace k objednávce v zápatí (pod obsahem)"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_DESC="Text v Markdownu připojený na úplný konec obsahu. Ideální pro pokyny k objednání, dodací lhůty a přímá kontaktní čísla."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_HINT="### Objednávky a technické poradenství\n* **Distributor:** Název vaší firmy\n* **Produkt:** {title} (SKU: {sku})\n* **Cena:** {price}\n* **Dostupnost a objednávky:** [Objednat tento model online]({url})\n* **Dodací lhůta:** odesíláme ze skladu do 24–48 h.\n* **Obchodní kontakt:** Tel.: +48 ... | E-mail: ..."
PLG_SYSTEM_AIMARKDOWN_ENABLE_ANALYTICS_LABEL="Zapnout analytiku AI"
PLG_SYSTEM_AIMARKDOWN_ENABLE_ANALYTICS_DESC="Zaznamenává návštěvy AI robotů (GPTBot, ClaudeBot, Perplexity) lokálně ve vaší databázi."
PLG_SYSTEM_AIMARKDOWN_ANALYTICS_DISPLAY_LIMIT_LABEL="Limit zobrazení statistik"
PLG_SYSTEM_AIMARKDOWN_ANALYTICS_DISPLAY_LIMIT_DESC="Kolik nejaktivnějších robotů, nejnavštěvovanějších stránek a posledních požadavků se zobrazí na nástěnce."
