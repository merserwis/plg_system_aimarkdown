PLG_SYSTEM_AIMARKDOWN_LLMS_EXCLUDE_URLS_DESC="Adresy lub ścieżki do pominięcia w /llms.txt, jeden w wierszu (np. /koszyk, /polityka-prywatnosci, /logowanie)."
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_LABEL="Sortuj pozycje według"
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_DESC="Kolejność produktów i artykułów w /llms.txt. Zdecydowanie zalecane: najpopularniejsze (odsłony)."
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_OPT_HITS="Najpopularniejsze (według odsłon)"
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_OPT_DATE="Najnowsze najpierw (według ID / daty)"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_LABEL="Maks. produktów / stron w /llms.txt"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_DESC="Ogranicza liczbę pozycji, aby nie przekroczyć okna kontekstu LLM. llmstxt.org zaleca 500–1000."
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_500="Pierwsze 500 pozycji (zalecane dla AI)"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_750="Pierwsze 750 pozycji"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_1000="Pierwsze 1000 pozycji"
