PLG_SYSTEM_AIMARKDOWN_ENABLE_FAQ_LABEL="Zapnout sekci FAQ produktu"
PLG_SYSTEM_AIMARKDOWN_ENABLE_FAQ_DESC="Zahrne do Markdownu strukturované FAQ. Přednostně použije vlastní schéma FAQPage nebo bloky details z popisu; pokud chybí, vytvoří kontextové otázky a odpovědi."
