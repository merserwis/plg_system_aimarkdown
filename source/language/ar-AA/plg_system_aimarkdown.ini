PLG_SYSTEM_AIMARKDOWN_ENABLE_MERCHANT_CONTEXT_DESC="يُدرج بيانات اعتماد الموزع المخصصة، وإشارات الثقة E-E-A-T، وتعليمات الشراء المباشر في Markdown لمحركات الذكاء الاصطناعي."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_INFO_LEGEND_LABEL="كيف يساعد هذا في ترتيبك لدى الذكاء الاصطناعي (GEO) والوسوم المتاحة"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_INFO_LEGEND_DESC="<div class=\"mb-2\"><strong>لماذا هذا مهم للذكاء الاصطناعي؟</strong> تفضّل نماذج اللغة (SearchGPT وPerplexity وClaude) التوصية بالبائعين الذين يصرّحون بوضوح بصفة الموزع والضمان المحلي والتسليم السريع وخدمات المعايرة، بدلًا من صفحات المصنّعين العامة.</div><div class=\"mb-1\"><strong>دليل الوسوم الديناميكية (تُستبدل تلقائيًا):</strong></div><ul class=\"small mb-2\"><li><code>{title}</code> - عنوان المنتج / المقالة</li><li><code>{sku}</code> - رمز الكتالوج / رقم SKU</li><li><code>{price}</code> - السعر المنسق مع الصافي/الإجمالي وضريبة VAT</li><li><code>{price_net}</code> - السعر الصافي فقط</li><li><code>{price_gross}</code> - السعر الإجمالي فقط</li><li><code>{currency}</code> - العملة (مثل PLN، EUR)</li><li><code>{availability}</code> - حالة المخزون (مثل InStock)</li><li><code>{brand}</code> - اسم الشركة المصنعة / العلامة التجارية</li><li><code>{category}</code> - تصنيف المنتج</li><li><code>{url}</code> - عنوان URL القانوني المطلق الكامل</li></ul>"
