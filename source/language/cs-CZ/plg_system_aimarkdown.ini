PLG_SYSTEM_AIMARKDOWN_AUTO_GENERATE_FAQ_DESC="Pokud stránka produktu nemá vlastní FAQ, doplní se otázky a odpovědi ze sady zvolené níže. Ve výchozím stavu vypnuto: zapněte jen tehdy, když jsou odpovědi pro vaše produkty pravdivé."
PLG_SYSTEM_AIMARKDOWN_PRIORITIZE_PDFS_LABEL="Upřednostnit PDF ke stažení"
PLG_SYSTEM_AIMARKDOWN_PRIORITIZE_PDFS_DESC="Vyhledá všechny odkazy na PDF (katalogové listy, návody, katalogy), převede je na absolutní URL a uvede je ve zvláštní sekci „Ke stažení a dokumentace“."
PLG_SYSTEM_AIMARKDOWN_UNROLL_TABS_ACCORDIONS_LABEL="Rozbalit záložky a akordeony"
PLG_SYSTEM_AIMARKDOWN_UNROLL_TABS_ACCORDIONS_DESC="Rozbalí skryté záložky a sbalené akordeony do přehledných, po sobě jdoucích nadpisů a sekcí Markdownu pro AI agenty."
PLG_SYSTEM_AIMARKDOWN_ENABLE_CACHE_LABEL="Zapnout mezipaměť Markdownu"
PLG_SYSTEM_AIMARKDOWN_ENABLE_CACHE_DESC="Ukládá převedené soubory Markdown do mezipaměti, aby AI agenti dostali odpověď během milisekund a server byl méně zatížen."
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_LABEL="Platnost mezipaměti"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_DESC="Jak dlouho zůstávají soubory Markdown v mezipaměti platné, než se znovu vytvoří."
