PLG_SYSTEM_AIMARKDOWN_ENABLE_FRONTMATTER_LABEL="启用 YAML Frontmatter"
PLG_SYSTEM_AIMARKDOWN_ENABLE_FRONTMATTER_DESC="在 Markdown 顶部为 LLM 添加结构化的 YAML 元数据（名称、价格、B2B 净价/含税价、SKU、库存状态、分类、下载、销售商）。"
PLG_SYSTEM_AIMARKDOWN_ENABLE_FAQ_LABEL="启用商品 FAQ 部分"
PLG_SYSTEM_AIMARKDOWN_ENABLE_FAQ_DESC="在 Markdown 中包含结构化 FAQ。优先使用自定义 FAQPage Schema 或描述中的 details 内容；如果没有，则自动生成与上下文相关的问答。"
PLG_SYSTEM_AIMARKDOWN_AUTO_GENERATE_FAQ_LABEL="自动生成缺失的 FAQ"
PLG_SYSTEM_AIMARKDOWN_AUTO_GENERATE_FAQ_DESC="如果商品没有自定义 FAQ 部分，则自动生成智能问答（保修、校准、交货、应用）。"
PLG_SYSTEM_AIMARKDOWN_PRIORITIZE_PDFS_LABEL="优先显示 PDF 下载"
PLG_SYSTEM_AIMARKDOWN_PRIORITIZE_PDFS_DESC="提取所有 PDF 链接（数据表、手册、目录），转换为绝对 URL，并列在专门的“下载与文档”部分中。"
PLG_SYSTEM_AIMARKDOWN_UNROLL_TABS_ACCORDIONS_LABEL="提取选项卡和折叠面板"
PLG_SYSTEM_AIMARKDOWN_UNROLL_TABS_ACCORDIONS_DESC="将隐藏的选项卡和折叠的手风琴面板展开为清晰、按顺序排列的 Markdown 标题和段落，便于 AI 代理读取。"
PLG_SYSTEM_AIMARKDOWN_ENABLE_CACHE_LABEL="启用 Markdown 缓存"
PLG_SYSTEM_AIMARKDOWN_ENABLE_CACHE_DESC="将转换后的 Markdown 文件保存到缓存中，以毫秒级速度响应 AI 代理并降低服务器负载。"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_LABEL="缓存有效期"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_DESC="缓存的 Markdown 文件在重新生成前保持有效的时间。"
