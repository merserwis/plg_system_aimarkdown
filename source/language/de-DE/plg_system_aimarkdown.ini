PLG_SYSTEM_AIMARKDOWN_EXTENSION_INFO_DESC="<p class=\"mb-1\"><strong>Repository & Dokumentation:</strong> <a href=\"https://github.com/merserwis/plg_system_aimarkdown/\" target=\"_blank\" rel=\"noopener noreferrer\">https://github.com/merserwis/plg_system_aimarkdown/</a></p><p class=\"mb-0\"><strong>Kontakt:</strong> <a href=\"mailto:a.blazewicz@merserwis.pl\">a.blazewicz@merserwis.pl</a> | <strong>Lizenz:</strong> AGPL-3.0</p>"
PLG_SYSTEM_AIMARKDOWN_ENABLE_FRONTMATTER_LABEL="YAML-Frontmatter aktivieren"
PLG_SYSTEM_AIMARKDOWN_ENABLE_FRONTMATTER_DESC="Stellt dem Markdown für LLMs strukturierte YAML-Metadaten voran (Titel, Preis, B2B netto/brutto, SKU, Verfügbarkeit, Kategorie, Downloads, Verkäufer)."
PLG_SYSTEM_AIMARKDOWN_ENABLE_FAQ_LABEL="FAQ-Bereich für Produkte aktivieren"
PLG_SYSTEM_AIMARKDOWN_ENABLE_FAQ_DESC="Fügt einen strukturierten FAQ-Bereich in das Markdown ein. Eigene FAQPage-Schema-Daten bzw. details-Elemente aus der Beschreibung haben Vorrang; fehlen sie, werden kontextbezogene Fragen und Antworten automatisch erzeugt."
PLG_SYSTEM_AIMARKDOWN_AUTO_GENERATE_FAQ_LABEL="Fehlende FAQs automatisch erzeugen"
PLG_SYSTEM_AIMARKDOWN_AUTO_GENERATE_FAQ_DESC="Hat eine Produktseite keine eigene FAQ, werden Fragen und Antworten aus dem unten gewählten Satz ergänzt. Standardmäßig aus: nur einschalten, wenn die Antworten für Ihre Produkte zutreffen."
PLG_SYSTEM_AIMARKDOWN_PRIORITIZE_PDFS_LABEL="PDF-Downloads hervorheben"
PLG_SYSTEM_AIMARKDOWN_PRIORITIZE_PDFS_DESC="Sammelt alle PDF-Links (Datenblätter, Handbücher, Kataloge), wandelt sie in absolute URLs um und listet sie in einem eigenen Abschnitt „Downloads & Dokumentation“ auf."
PLG_SYSTEM_AIMARKDOWN_UNROLL_TABS_ACCORDIONS_LABEL="Reiter & Akkordeons auslesen"
PLG_SYSTEM_AIMARKDOWN_UNROLL_TABS_ACCORDIONS_DESC="Wandelt verborgene Reiter und eingeklappte Akkordeons für KI-Agenten in fortlaufende Markdown-Überschriften und -Abschnitte um."
PLG_SYSTEM_AIMARKDOWN_ENABLE_CACHE_LABEL="Markdown-Cache aktivieren"
PLG_SYSTEM_AIMARKDOWN_ENABLE_CACHE_DESC="Speichert das erzeugte Markdown im Cache, damit KI-Agenten in Millisekunden bedient werden und die Serverlast sinkt."
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_LABEL="Cache-Dauer"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_DESC="Wie lange zwischengespeichertes Markdown gültig bleibt, bevor es neu erzeugt wird."
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_3600="1 Stunde"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_21600="6 Stunden"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_43200="12 Stunden"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_86400="24 Stunden (empfohlen)"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_604800="7 Tage"
PLG_SYSTEM_AIMARKDOWN_EXTRA_QUERY_PARAMS_LABEL="Zusätzliche URL-Parameter"
PLG_SYSTEM_AIMARKDOWN_EXTRA_QUERY_PARAMS_DESC="URL-Parameter, die den Inhalt einer Seite Ihrer Website ändern und in der Markdown-URL und im Cache-Schlüssel bleiben müssen, durch Kommas getrennt (z. B. filter_brand, sort). Routing-Parameter von Joomla und Gridbox, Seitenzahlen, Suche und Filter bleiben immer erhalten; andere Parameter (utm_*, fbclid, Zufallswerte) werden ignoriert, damit sie den Cache nicht füllen."
PLG_SYSTEM_AIMARKDOWN_CUSTOM_EXCLUDE_SELECTORS_LABEL="Eigene Ausschluss-Selektoren"
PLG_SYSTEM_AIMARKDOWN_CUSTOM_EXCLUDE_SELECTORS_DESC="Ein Selektor pro Zeile; passende Elemente werden aus dem Markdown entfernt. Unterstützte Formate:<br>• CSS-Klasse: .promo-banner, .newsletter-popup<br>• CSS-ID: #live-chat, #cookie-bar<br>• HTML-Tag: aside, dialog<br>• Tag mit Klasse: div.popup, section.advert<br>• XPath: //div[@data-banner='true']"
PLG_SYSTEM_AIMARKDOWN_SHOW_CATEGORY_LABEL="Kategorie anzeigen"
PLG_SYSTEM_AIMARKDOWN_SHOW_CATEGORY_DESC="Zeigt die Kategorie des Beitrags oder Produkts im erzeugten Markdown an."
PLG_SYSTEM_AIMARKDOWN_SHOW_TAGS_LABEL="Schlagwörter anzeigen"
PLG_SYSTEM_AIMARKDOWN_SHOW_TAGS_DESC="Zeigt Schlagwörter im erzeugten Markdown an."
PLG_SYSTEM_AIMARKDOWN_SHOW_AUTHOR_LABEL="Autor anzeigen"
PLG_SYSTEM_AIMARKDOWN_SHOW_AUTHOR_DESC="Zeigt den Autor im erzeugten Markdown an."
PLG_SYSTEM_AIMARKDOWN_SHOW_DATE_LABEL="Datum anzeigen"
PLG_SYSTEM_AIMARKDOWN_SHOW_DATE_DESC="Zeigt das Veröffentlichungsdatum im erzeugten Markdown an."
PLG_SYSTEM_AIMARKDOWN_SHOW_DESCRIPTION_LABEL="Beschreibung anzeigen"
PLG_SYSTEM_AIMARKDOWN_SHOW_DESCRIPTION_DESC="Zeigt die Hauptbeschreibung des Beitrags oder Produkts im erzeugten Markdown an."
PLG_SYSTEM_AIMARKDOWN_SHOW_IMAGES_LABEL="Bilder anzeigen"
PLG_SYSTEM_AIMARKDOWN_SHOW_IMAGES_DESC="Bindet Bilder in das erzeugte Markdown ein."
PLG_SYSTEM_AIMARKDOWN_SHOW_CUSTOM_FIELDS_LABEL="Eigene Felder anzeigen"
PLG_SYSTEM_AIMARKDOWN_SHOW_CUSTOM_FIELDS_DESC="Zeigt eigene Felder und technische Produktdaten aus Balbooa Gridbox an."
PLG_SYSTEM_AIMARKDOWN_SHOW_ALTERNATE_LINK_LABEL="Alternativen Link ausgeben"
PLG_SYSTEM_AIMARKDOWN_SHOW_ALTERNATE_LINK_DESC="Fügt den Link-Header nach RFC 8288 und das Link-Tag rel=alternate im HTML-Head ein."
PLG_SYSTEM_AIMARKDOWN_MARKDOWN_NOINDEX_LABEL="Markdown-Seiten: noindex"
PLG_SYSTEM_AIMARKDOWN_MARKDOWN_NOINDEX_DESC="Sendet „X-Robots-Tag: noindex“ mit der Markdown-Version einer Seite, damit Suchmaschinen nur die HTML-Seite in ihren Ergebnissen zeigen. Die Markdown-Version sendet immer einen Canonical-Link-Header auf die HTML-Seite; noindex macht es ausdrücklich. KI-Agenten lesen sie weiterhin."
PLG_SYSTEM_AIMARKDOWN_SERVICE_DOC_PATH_LABEL="Pfad der Service-Dokumentation"
PLG_SYSTEM_AIMARKDOWN_SERVICE_DOC_PATH_DESC="Pfad (relativ zum Stammverzeichnis der Website), der im Link-Header als rel=\"service-doc\" angekündigt wird, z. B. Ihre Kontakt- oder „Über uns“-Seite. Leer = wird nicht ausgegeben. Frühere Versionen kündigten immer /kontakt an."
PLG_SYSTEM_AIMARKDOWN_ENABLE_LLMSTXT_LABEL="/llms.txt-Generator aktivieren"
PLG_SYSTEM_AIMARKDOWN_ENABLE_LLMSTXT_DESC="Erzeugt und pflegt automatisch eine standardisierte Datei /llms.txt im Stammverzeichnis der Website gemäß https://llmstxt.org."
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_LABEL="Titel der Website / des Projekts (H1)"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_DESC="Der Haupttitel oben in /llms.txt. Leer = der Name der Website aus der globalen Konfiguration."
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_HINT="z. B. Merserwis – Messtechnik & Kalibrierung"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_LABEL="Kurzbeschreibung als Zitat (>)"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_DESC="Ein knapper Überblick in 2–3 Sätzen über Unternehmen, Akkreditierung und Angebot für LLMs."
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_HINT="z. B. Offizieller Distributor von Prüftechnik in Polen. Messgeräte für die elektrische Sicherheit, EVSE-Prüfung, Netzanalysatoren und Kalibrierdienstleistungen."
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_LABEL="Intervall der automatischen Erzeugung"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_DESC="Zeitabstand zwischen automatischen Neuerzeugungen der Datei /llms.txt im Hintergrund."
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_OPT_43200="Alle 12 Stunden"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_OPT_86400="Alle 24 Stunden (täglich)"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_OPT_432000="Alle 5 Tage"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_OPT_1296000="Alle 15 Tage"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_OPT_2592000="Alle 30 Tage (monatlich)"
PLG_SYSTEM_AIMARKDOWN_LLMS_EXCLUDE_URLS_LABEL="URLs von /llms.txt ausschließen"
PLG_SYSTEM_AIMARKDOWN_LLMS_EXCLUDE_URLS_DESC="URLs oder Pfade, die nicht in /llms.txt erscheinen sollen, eine pro Zeile (z. B. /koszyk, /polityka-prywatnosci, /logowanie)."
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_LABEL="Einträge sortieren nach"
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_DESC="Legt fest, welche Produkte und Beiträge in /llms.txt Vorrang haben. Empfohlen: Am beliebtesten (Zugriffe)."
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_OPT_HITS="Am beliebtesten (nach Aufrufen / Zugriffen)"
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_OPT_DATE="Neueste zuerst (nach ID / Datum)"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_LABEL="Max. Produkte / Seiten in /llms.txt"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_DESC="Begrenzt die Anzahl der Einträge, damit das Kontextfenster von LLMs nicht überschritten wird. llmstxt.org empfiehlt 500–1000."
PLG_SYSTEM_AIMARKDOWN_LLMS_DESC_LENGTH_LABEL="Länge der Beschreibung"
PLG_SYSTEM_AIMARKDOWN_LLMS_DESC_LENGTH_DESC="Maximale Länge einer Beschreibung in /llms.txt (Zeichen). Längere Beschreibungen werden nach dem letzten ganzen Wort gekürzt und enden mit „…“."
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_500="Top 500 Einträge (empfohlen für KI)"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_750="Top 750 Einträge"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_1000="Top 1000 Einträge"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_2000="Top 2000 Einträge"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_0="Alle Einträge (ohne Limit – Datei kann sehr groß werden)"
PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_LABEL="Menü für „Hauptbereiche“"
PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_DESC="Site-Menü, dessen öffentliche Einträge der obersten Ebene im Block „Hauptbereiche“ aufgeführt werden. Leer = alle Site-Menüs (Standard seit 1.6.0; frühere Versionen nutzten das Menü „main“, das auf den meisten Websites das Administrator-Menü ist, daher blieb der Block leer)."
PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_OPT_EMPTY="- Alle Site-Menüs -"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_LABEL="Gridbox-URL-Modus"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_DESC="Wie die URLs von Gridbox-Seiten und -Kategorien gebildet werden. „Kanonisch (Menüeintrag + Router)“ (Standard) = der Gridbox-Router-Pfad unter dem Menüeintrag, der die Gridbox-App der Seite anzeigt, z. B. /oferta/category/page – dieselbe URL wie in der Gridbox-Canonical-Angabe und der Sitemap; Seiten mit eigenem Menüeintrag verwenden dessen URL. „Joomla Router“ = Router-Pfad ab dem Stammverzeichnis der Website, z. B. /category/page (Verhalten von 1.5.3). „Alias“ = Stammverzeichnis + Alias (Verhalten bis Version 1.5.1; nur korrekt, wenn jede Gridbox-Seite direkt unter /alias liegt)."
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_MENU="Kanonisch (Menüeintrag + Router)"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_ROUTER="Joomla Router (SEF)"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_ALIAS="Alias (veraltet)"
PLG_SYSTEM_AIMARKDOWN_ENABLE_MERCHANT_CONTEXT_LABEL="Händlerautorität & CTA aktivieren"
PLG_SYSTEM_AIMARKDOWN_ENABLE_MERCHANT_CONTEXT_DESC="Fügt dem Markdown für KI-Suchmaschinen eigene Händlernachweise, E-E-A-T-Vertrauenssignale und direkte Kaufhinweise hinzu."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_INFO_LEGEND_LABEL="Wie dies Ihr KI-Ranking (GEO) verbessert & verfügbare Platzhalter"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_INFO_LEGEND_DESC="<div class=\"mb-2\"><strong>Warum ist das für KI entscheidend?</strong> LLMs (SearchGPT, Perplexity, Claude) empfehlen bevorzugt Händler, die ausdrücklich ihren Distributorstatus, lokale Garantie, schnelle Lieferung und Kalibrierdienstleistungen angeben, statt allgemeiner Herstellerseiten.</div><div class=\"mb-1\"><strong>Dynamische Platzhalter (werden automatisch ersetzt):</strong></div><ul class=\"small mb-2\"><li><code>{title}</code> - Titel des Produkts / Beitrags</li><li><code>{sku}</code> - Katalognummer / SKU</li><li><code>{price}</code> - Formatierter Preis mit netto/brutto & MwSt.</li><li><code>{price_net}</code> - Nur Nettopreis</li><li><code>{price_gross}</code> - Nur Bruttopreis</li><li><code>{currency}</code> - Währung (z. B. PLN, EUR)</li><li><code>{availability}</code> - Lagerstatus (z. B. InStock)</li><li><code>{brand}</code> - Hersteller / Marke</li><li><code>{category}</code> - Produktkategorie</li><li><code>{url}</code> - Vollständige absolute kanonische URL</li></ul>"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_LABEL="Händler- / Firmenname"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_DESC="Wird in das YAML-Frontmatter („seller“) eingefügt und für Autoritätsangaben verwendet."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_HINT="z. B. Merserwis oder Ihr Firmenname"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_LABEL="Geschäftsrolle / E-E-A-T-Titel"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_DESC="Rolle oder Akkreditierung (z. B. Offizieller Distributor für Polen, Akkreditiertes Kalibrierlabor)."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_HINT="z. B. Offizieller Distributor für Polen & akkreditiertes Labor"
PLG_SYSTEM_AIMARKDOWN_VAT_RATE_LABEL="MwSt.-Satz (%)"
PLG_SYSTEM_AIMARKDOWN_VAT_RATE_DESC="Steuersatz zur Berechnung des Netto- oder Bruttopreises (nicht verwendet bei „Endpreis“)."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_LABEL="Autoritätshinweis im Kopf (über dem Inhalt)"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_DESC="Text direkt nach dem Frontmatter. Wird automatisch als hervorgehobenes Zitat (>) formatiert – „>“ muss nicht von Hand geschrieben werden."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_HINT="**Offizieller Vertrieb und Service:** {title} (Code: {sku}) erhalten Sie direkt beim offiziellen Distributor, mit lokaler Garantie und optionaler Kalibrierung."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_LABEL="CTA & Bestellinfos im Fuß (unter dem Inhalt)"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_DESC="Markdown-Text, der ganz am Ende des Inhalts angefügt wird. Ideal für Bestellhinweise, Lieferzeiten und direkte Telefonnummern."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_HINT="### Bestellung und technische Beratung\n* **Distributor:** Ihr Firmenname\n* **Produkt:** {title} (SKU: {sku})\n* **Preis:** {price}\n* **Verfügbarkeit und Bestellung:** [Dieses Modell online bestellen]({url})\n* **Lieferzeit:** Versand ab Lager innerhalb von 24–48 h.\n* **Vertrieb:** Tel.: +48 ... | E-Mail: ..."
PLG_SYSTEM_AIMARKDOWN_ENABLE_ANALYTICS_LABEL="KI-Analytik aktivieren"
PLG_SYSTEM_AIMARKDOWN_ENABLE_ANALYTICS_DESC="Protokolliert Besuche von KI-Bots (GPTBot, ClaudeBot, Perplexity) lokal in Ihrer Datenbank."
PLG_SYSTEM_AIMARKDOWN_ANALYTICS_DISPLAY_LIMIT_LABEL="Anzeigelimit der Analytik"
PLG_SYSTEM_AIMARKDOWN_ANALYTICS_DISPLAY_LIMIT_DESC="Wie viele Top-Bots, meistbesuchte Seiten und letzte Anfragen im Dashboard angezeigt werden."
PLG_SYSTEM_AIMARKDOWN_ANALYTICS_DISPLAY_LIMIT_OPT_10="10 (Standard)"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_LABEL="Aufbewahrung der Protokolle"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_DESC="Protokolle, die älter als die angegebene Anzahl von Tagen sind, werden automatisch gelöscht."
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_7="7 Tage"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_14="14 Tage"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_30="30 Tage (empfohlen)"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_60="60 Tage"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_90="90 Tage"
PLG_SYSTEM_AIMARKDOWN_TRUST_PROXY_HEADERS_LABEL="Proxy-IP-Headern vertrauen"
PLG_SYSTEM_AIMARKDOWN_TRUST_PROXY_HEADERS_DESC="Liest die IP des Besuchers aus CF-Connecting-IP / X-Forwarded-For. NUR aktivieren, wenn die Website hinter Cloudflare oder Ihrem eigenen Reverse Proxy liegt – sonst kann jeder Client diese Header fälschen. Deaktiviert = REMOTE_ADDR wird verwendet."

