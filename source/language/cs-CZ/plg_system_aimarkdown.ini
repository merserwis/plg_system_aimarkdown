PLG_SYSTEM_AIMARKDOWN_SHOW_ALTERNATE_LINK_DESC="Přidá hlavičku Link podle RFC 8288 a značku odkazu rel=alternate do sekce head v HTML."
PLG_SYSTEM_AIMARKDOWN_MARKDOWN_NOINDEX_LABEL="Stránky Markdown: noindex"
PLG_SYSTEM_AIMARKDOWN_MARKDOWN_NOINDEX_DESC="Odesílá „X-Robots-Tag: noindex“ s verzí stránky v Markdownu, aby vyhledávače ve výsledcích ponechaly jen stránku HTML. Verze v Markdownu vždy odesílá kanonickou hlavičku Link na stránku HTML; noindex to říká výslovně. Agenti AI ji čtou dál."
PLG_SYSTEM_AIMARKDOWN_SERVICE_DOC_PATH_LABEL="Cesta k dokumentaci služby"
PLG_SYSTEM_AIMARKDOWN_SERVICE_DOC_PATH_DESC="Cesta (vzhledem ke kořeni webu) uváděná v hlavičce Link jako rel=\"service-doc\", např. vaše kontaktní stránka nebo stránka „O nás“. Ponechte prázdné, pokud ji nechcete uvádět. Předchozí verze uváděly vždy /kontakt."
PLG_SYSTEM_AIMARKDOWN_ENABLE_LLMSTXT_LABEL="Zapnout generátor /llms.txt"
PLG_SYSTEM_AIMARKDOWN_ENABLE_LLMSTXT_DESC="Automaticky vytváří a udržuje standardizovaný soubor /llms.txt v kořenovém adresáři webu podle https://llmstxt.org."
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_LABEL="Název webu / projektu (H1)"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_DESC="Hlavní nadpis na začátku /llms.txt. Prázdné = název webu z globálního nastavení."
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_HINT="např. Merserwis - Měřicí přístroje a kalibrace"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_LABEL="Krátké shrnutí jako citace (>)"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_DESC="Stručný přehled firmy, akreditací a nabídky ve 2–3 větách pro LLM."
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_HINT="např. Oficiální distributor zkušebních přístrojů v Polsku. Měřiče elektrické bezpečnosti, testování nabíjecích stanic EVSE, analyzátory kvality sítě a kalibrační služby."
