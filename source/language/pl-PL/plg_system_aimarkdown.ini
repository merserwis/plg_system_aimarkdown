PLG_SYSTEM_AIMARKDOWN_ENABLE_FRONTMATTER_LABEL="Włącz YAML Frontmatter"
PLG_SYSTEM_AIMARKDOWN_ENABLE_FRONTMATTER_DESC="Dodaje na początku Markdown dla LLM uporządkowane metadane YAML (tytuł, cena, netto/brutto B2B, SKU, dostępność, kategoria, pliki do pobrania, sprzedawca)."
PLG_SYSTEM_AIMARKDOWN_ENABLE_FAQ_LABEL="Włącz sekcję FAQ produktu"
PLG_SYSTEM_AIMARKDOWN_ENABLE_FAQ_DESC="Dodaje uporządkowane FAQ do Markdown. Najpierw używa własnego schematu FAQPage lub bloków details z opisu; gdy ich brak, automatycznie tworzy pytania i odpowiedzi z kontekstu."
PLG_SYSTEM_AIMARKDOWN_AUTO_GENERATE_FAQ_LABEL="Generuj brakujące FAQ automatycznie"
PLG_SYSTEM_AIMARKDOWN_AUTO_GENERATE_FAQ_DESC="Gdy produkt nie ma własnej sekcji FAQ, automatycznie tworzy trafne pytania i odpowiedzi (gwarancja, wzorcowanie, dostawa, zastosowania)."
PLG_SYSTEM_AIMARKDOWN_PRIORITIZE_PDFS_LABEL="Wyróżnij pliki PDF do pobrania"
PLG_SYSTEM_AIMARKDOWN_PRIORITIZE_PDFS_DESC="Wyszukuje wszystkie linki do plików PDF (karty katalogowe, instrukcje, katalogi), zamienia je na adresy bezwzględne i wypisuje w osobnej sekcji „Pliki do pobrania i dokumentacja”."
PLG_SYSTEM_AIMARKDOWN_UNROLL_TABS_ACCORDIONS_LABEL="Rozwijaj karty i akordeony"
PLG_SYSTEM_AIMARKDOWN_UNROLL_TABS_ACCORDIONS_DESC="Rozwija ukryte karty i zwinięte akordeony w czytelne, kolejne nagłówki i sekcje Markdown dla agentów AI."
PLG_SYSTEM_AIMARKDOWN_ENABLE_CACHE_LABEL="Włącz pamięć podręczną Markdown"
PLG_SYSTEM_AIMARKDOWN_ENABLE_CACHE_DESC="Przechowuje przekonwertowane pliki Markdown w pamięci podręcznej, aby obsługiwać agentów AI w milisekundach i zmniejszyć obciążenie serwera."
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_LABEL="Czas życia pamięci podręcznej"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_DESC="Jak długo pliki Markdown w pamięci podręcznej pozostają ważne, zanim zostaną wygenerowane ponownie."
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_3600="1 godzina"
