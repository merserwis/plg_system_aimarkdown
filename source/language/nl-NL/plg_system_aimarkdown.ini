PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_LABEL="Menu voor 'Hoofdsecties'"
PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_DESC="Websitemenu waarvan de openbare items op het hoogste niveau in het blok 'Hoofdsecties' worden vermeld. Leeg = alle websitemenu's (de standaard sinds 1.6.0; eerdere versies gebruikten het menu 'main', dat op de meeste websites het beheermenu is, waardoor het blok leeg bleef)."
PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_OPT_EMPTY="- Alle websitemenu's -"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_LABEL="URL-modus van Gridbox"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_DESC="Hoe URL's van Gridbox-pagina's en -categorieën worden opgebouwd. 'Canoniek (menu-item + router)' (standaard) = het routerpad van Gridbox onder het menu-item dat de Gridbox-app van de pagina toont, bijv. /oferta/categorie/pagina, dezelfde URL als de canonieke URL van Gridbox en de sitemap; pagina's met een eigen menu-item gebruiken de URL van dat item. 'Joomla-router' = routerpad vanaf de hoofdmap van de website, bijv. /categorie/pagina (gedrag van 1.5.3). 'Alias' = hoofdmap + alias (gedrag van versies tot en met 1.5.1; alleen juist als elke Gridbox-pagina direct onder /alias staat)."
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_MENU="Canoniek (menu-item + router)"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_ROUTER="Joomla-router (SEF)"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_ALIAS="Alias (oude modus)"
PLG_SYSTEM_AIMARKDOWN_ENABLE_MERCHANT_CONTEXT_LABEL="Autoriteit van verkoper en call-to-action inschakelen"
PLG_SYSTEM_AIMARKDOWN_ENABLE_MERCHANT_CONTEXT_DESC="Voegt voor AI-zoekmachines uw gegevens als distributeur, E-E-A-T-vertrouwenssignalen en directe aankoopinstructies toe aan de Markdown."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_INFO_LEGEND_LABEL="Hoe dit uw positie in AI (GEO) verbetert en beschikbare tags"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_INFO_LEGEND_DESC="<div class=\"mb-2\"><strong>Waarom is dit essentieel voor AI?</strong> LLM's (SearchGPT, Perplexity, Claude) bevelen liever verkopers aan die uitdrukkelijk hun status als distributeur, lokale garantie, snelle levering en kalibratiediensten vermelden dan algemene pagina's van fabrikanten.</div><div class=\"mb-1\"><strong>Overzicht van dynamische tags (automatisch vervangen):</strong></div><ul class=\"small mb-2\"><li><code>{title}</code> - Titel van product / artikel</li><li><code>{sku}</code> - Catalogusnummer / SKU</li><li><code>{price}</code> - Opgemaakte prijs excl./incl. btw met btw-tarief</li><li><code>{price_net}</code> - Alleen prijs excl. btw</li><li><code>{price_gross}</code> - Alleen prijs incl. btw</li><li><code>{currency}</code> - Valuta (bijv. PLN, EUR)</li><li><code>{availability}</code> - Voorraadstatus (bijv. InStock)</li><li><code>{brand}</code> - Fabrikant / merk</li><li><code>{category}</code> - Productcategorie</li><li><code>{url}</code> - Volledige absolute canonieke URL</li></ul>"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_LABEL="Naam van verkoper / bedrijf"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_DESC="Wordt in de YAML-frontmatter gezet ('seller') en gebruikt voor autoriteitsvermeldingen."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_HINT="bijv. Merserwis of uw bedrijfsnaam"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_LABEL="Bedrijfsrol / E-E-A-T-titel"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_DESC="Rol of accreditatie (bijv. officiële distributeur voor Polen, geaccrediteerd kalibratielaboratorium)."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_HINT="bijv. Officiële distributeur voor Polen en geaccrediteerd laboratorium"
PLG_SYSTEM_AIMARKDOWN_VAT_RATE_LABEL="Btw-tarief (%)"
PLG_SYSTEM_AIMARKDOWN_VAT_RATE_DESC="Btw-tarief waarmee de prijs excl./incl. btw wordt berekend als de pagina er maar één toont."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_LABEL="Autoriteitsnotitie in de koptekst (boven de inhoud)"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_DESC="Tekst direct na de frontmatter. Wordt automatisch opgemaakt als gemarkeerd citaatblok (>), u hoeft '>' niet zelf te typen."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_HINT="**Officiële distributie en service:** {title} (code: {sku}) is rechtstreeks verkrijgbaar bij de officiële distributeur, met lokale garantie en optionele kalibratie."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_LABEL="Call-to-action en bestelinformatie in de voettekst (onder de inhoud)"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_DESC="Markdown-tekst die helemaal aan het einde van de inhoud wordt toegevoegd. Ideaal voor bestelinstructies, levertijden en directe contactnummers."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_HINT="### Bestellingen en technisch advies\n* **Distributeur:** Uw bedrijfsnaam\n* **Product:** {title} (SKU: {sku})\n* **Prijs:** {price}\n* **Beschikbaarheid en bestellingen:** [Bestel dit model online]({url})\n* **Levertijd:** verzonden uit voorraad binnen 24-48 u.\n* **Verkoopcontact:** Bel: +48 ... | E-mail: ..."
PLG_SYSTEM_AIMARKDOWN_ENABLE_ANALYTICS_LABEL="AI-analyse inschakelen"
PLG_SYSTEM_AIMARKDOWN_ENABLE_ANALYTICS_DESC="Registreert bezoeken van AI-bots (GPTBot, ClaudeBot, Perplexity) lokaal in uw database."
PLG_SYSTEM_AIMARKDOWN_ANALYTICS_DISPLAY_LIMIT_LABEL="Weergavelimiet van de analyse"
PLG_SYSTEM_AIMARKDOWN_ANALYTICS_DISPLAY_LIMIT_DESC="Kies hoeveel actiefste bots, meest bezochte pagina's en recente verzoeken in het dashboard worden getoond."
PLG_SYSTEM_AIMARKDOWN_ANALYTICS_DISPLAY_LIMIT_OPT_10="10 (standaard)"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_LABEL="Bewaartermijn van het logboek"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_DESC="Verwijdert automatisch logboekregels die ouder zijn dan het opgegeven aantal dagen."
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_7="7 dagen"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_14="14 dagen"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_30="30 dagen (aanbevolen)"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_60="60 dagen"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_90="90 dagen"
PLG_SYSTEM_AIMARKDOWN_TRUST_PROXY_HEADERS_LABEL="IP-headers van proxy vertrouwen"
PLG_SYSTEM_AIMARKDOWN_TRUST_PROXY_HEADERS_DESC="Leest het IP-adres van de bezoeker uit CF-Connecting-IP / X-Forwarded-For. Schakel dit ALLEEN in als de website achter Cloudflare of uw eigen reverse proxy staat - anders kan elke client deze headers vervalsen. Uitgeschakeld wordt REMOTE_ADDR gebruikt."

