PLG_SYSTEM_AIMARKDOWN_SERVICE_DOC_PATH_DESC="在 Link 标头中以 rel=\"service-doc\" 声明的路径（相对于站点根目录），例如联系页面或“关于我们”页面。留空则不声明。旧版本始终声明 /kontakt。"
