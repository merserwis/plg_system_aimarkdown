PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_HINT="### الطلبات والاستشارات الفنية\n* **الموزع:** اسم شركتك\n* **المنتج:** {title} (SKU: {sku})\n* **السعر:** {price}\n* **التوفر والطلبات:** [اطلب هذا الطراز عبر الإنترنت]({url})\n* **مدة التسليم:** الشحن من المخزون خلال 24-48 ساعة.\n* **التواصل مع المبيعات:** الهاتف: +48 ... | البريد الإلكتروني: ..."
