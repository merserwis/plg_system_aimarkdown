PLG_SYSTEM_AIMARKDOWN_INSTALL_URL_MODE_MIGRATED="AI Markdown : le mode d'URL Gridbox a été basculé sur « Canonique (élément de menu + routeur) » — liens identiques au plan du site, par ex. /oferta/…. Générez à nouveau /llms.txt."
