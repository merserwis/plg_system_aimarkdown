PLG_SYSTEM_AIMARKDOWN_SHOW_DATE_DESC="Wyświetla datę publikacji w wygenerowanym Markdown."
PLG_SYSTEM_AIMARKDOWN_SHOW_DESCRIPTION_LABEL="Pokaż opis"
PLG_SYSTEM_AIMARKDOWN_SHOW_DESCRIPTION_DESC="Wyświetla główny opis wpisu lub produktu w wygenerowanym Markdown."
