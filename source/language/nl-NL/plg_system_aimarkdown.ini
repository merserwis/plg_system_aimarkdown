PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_DESC="Beperkt het aantal items, zodat het contextvenster van LLM's niet wordt overschreden. llmstxt.org beveelt 500-1000 aan."
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_500="Top 500 items (aanbevolen voor AI)"
