PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_LABEL="简短摘要引用块（>）"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_DESC="面向 LLM 的 2-3 句简明概述，介绍公司、资质认可和所提供的产品与服务。"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_HINT="例如：波兰测试设备官方经销商。提供电气安全测试仪、EVSE 测试、电能质量分析仪及校准服务。"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_LABEL="自动生成间隔"
