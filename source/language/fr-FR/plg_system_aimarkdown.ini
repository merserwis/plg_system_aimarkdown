PLG_SYSTEM_AIMARKDOWN_EXTENSION_INFO_DESC="<p class=\"mb-1\"><strong>Dépôt et documentation :</strong> <a href=\"https://github.com/merserwis/plg_system_aimarkdown/\" target=\"_blank\" rel=\"noopener noreferrer\">https://github.com/merserwis/plg_system_aimarkdown/</a></p><p class=\"mb-0\"><strong>Contact :</strong> <a href=\"mailto:a.blazewicz@merserwis.pl\">a.blazewicz@merserwis.pl</a> | <strong>Licence :</strong> AGPL-3.0</p>"
PLG_SYSTEM_AIMARKDOWN_ENABLE_FRONTMATTER_LABEL="Activer le Frontmatter YAML"
PLG_SYSTEM_AIMARKDOWN_ENABLE_FRONTMATTER_DESC="Ajoute en tête du Markdown des métadonnées YAML structurées pour les LLM (titre, prix, HT/TTC B2B, référence, disponibilité, catégorie, téléchargements, vendeur)."
PLG_SYSTEM_AIMARKDOWN_ENABLE_FAQ_LABEL="Activer la section FAQ produit"
PLG_SYSTEM_AIMARKDOWN_ENABLE_FAQ_DESC="Inclut une FAQ structurée dans le Markdown. Utilise en priorité le schéma FAQPage ou les blocs details de la description ; génère des questions-réponses contextuelles s’ils sont absents."
PLG_SYSTEM_AIMARKDOWN_AUTO_GENERATE_FAQ_LABEL="Générer automatiquement les FAQ manquantes"
PLG_SYSTEM_AIMARKDOWN_AUTO_GENERATE_FAQ_DESC="Si une page produit n’a pas sa propre FAQ, les questions et réponses de l’ensemble choisi ci-dessous sont ajoutées. Désactivé par défaut : ne l’activez que si les réponses sont vraies pour vos produits."
PLG_SYSTEM_AIMARKDOWN_PRIORITIZE_PDFS_LABEL="Mettre en avant les PDF à télécharger"
PLG_SYSTEM_AIMARKDOWN_PRIORITIZE_PDFS_DESC="Extrait tous les liens vers des PDF (fiches techniques, manuels, catalogues), les convertit en URL absolues et les liste dans une section dédiée « Téléchargements et documentation »."
PLG_SYSTEM_AIMARKDOWN_UNROLL_TABS_ACCORDIONS_LABEL="Extraire les onglets et accordéons"
PLG_SYSTEM_AIMARKDOWN_UNROLL_TABS_ACCORDIONS_DESC="Déplie les onglets masqués et les accordéons fermés en titres et sections Markdown successifs et propres pour les agents IA."
PLG_SYSTEM_AIMARKDOWN_ENABLE_CACHE_LABEL="Activer le cache Markdown"
PLG_SYSTEM_AIMARKDOWN_ENABLE_CACHE_DESC="Conserve les fichiers Markdown convertis en cache pour répondre aux agents IA en quelques millisecondes et réduire la charge du serveur."
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_LABEL="Durée de vie du cache"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_DESC="Durée pendant laquelle les fichiers Markdown en cache restent valides avant d’être régénérés."
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_3600="1 heure"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_21600="6 heures"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_43200="12 heures"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_86400="24 heures (recommandé)"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_604800="7 jours"
PLG_SYSTEM_AIMARKDOWN_EXTRA_QUERY_PARAMS_LABEL="Paramètres de requête supplémentaires"
PLG_SYSTEM_AIMARKDOWN_EXTRA_QUERY_PARAMS_DESC="Paramètres de requête qui modifient le contenu d’une page de votre site et doivent être conservés dans l’URL Markdown et la clé de cache, séparés par des virgules (p. ex. filter_brand, sort). Le routage Joomla et Gridbox, la pagination, la recherche et les filtres sont toujours conservés ; les autres paramètres (utm_*, fbclid, valeurs aléatoires) sont ignorés afin de ne pas remplir le cache."
PLG_SYSTEM_AIMARKDOWN_CUSTOM_EXCLUDE_SELECTORS_LABEL="Sélecteurs à exclure"
PLG_SYSTEM_AIMARKDOWN_CUSTOM_EXCLUDE_SELECTORS_DESC="Saisissez un sélecteur par ligne pour retirer les éléments correspondants du Markdown. Formats pris en charge :<br>• Classe CSS : .promo-banner, .newsletter-popup<br>• ID CSS : #live-chat, #cookie-bar<br>• Balise HTML : aside, dialog<br>• Balise avec classe : div.popup, section.advert<br>• XPath : //div[@data-banner='true']"
PLG_SYSTEM_AIMARKDOWN_SHOW_CATEGORY_LABEL="Afficher la catégorie"
PLG_SYSTEM_AIMARKDOWN_SHOW_CATEGORY_DESC="Affiche la catégorie de l’article ou du produit dans le Markdown généré."
PLG_SYSTEM_AIMARKDOWN_SHOW_TAGS_LABEL="Afficher les tags"
PLG_SYSTEM_AIMARKDOWN_SHOW_TAGS_DESC="Affiche les tags dans le Markdown généré."
PLG_SYSTEM_AIMARKDOWN_SHOW_AUTHOR_LABEL="Afficher l’auteur"
PLG_SYSTEM_AIMARKDOWN_SHOW_AUTHOR_DESC="Affiche l’auteur dans le Markdown généré."
PLG_SYSTEM_AIMARKDOWN_SHOW_DATE_LABEL="Afficher la date"
PLG_SYSTEM_AIMARKDOWN_SHOW_DATE_DESC="Affiche la date de publication dans le Markdown généré."
PLG_SYSTEM_AIMARKDOWN_SHOW_DESCRIPTION_LABEL="Afficher la description"
PLG_SYSTEM_AIMARKDOWN_SHOW_DESCRIPTION_DESC="Affiche la description principale de l’article ou du produit dans le Markdown généré."
PLG_SYSTEM_AIMARKDOWN_SHOW_IMAGES_LABEL="Afficher les images"
PLG_SYSTEM_AIMARKDOWN_SHOW_IMAGES_DESC="Inclut les images dans le Markdown généré."
PLG_SYSTEM_AIMARKDOWN_SHOW_CUSTOM_FIELDS_LABEL="Afficher les champs personnalisés"
PLG_SYSTEM_AIMARKDOWN_SHOW_CUSTOM_FIELDS_DESC="Affiche les champs personnalisés et les caractéristiques techniques des produits de Balbooa Gridbox."
PLG_SYSTEM_AIMARKDOWN_SHOW_ALTERNATE_LINK_LABEL="Afficher le lien alternatif"
PLG_SYSTEM_AIMARKDOWN_SHOW_ALTERNATE_LINK_DESC="Ajoute l’en-tête Link (RFC 8288) et la balise de lien rel=alternate dans la section head du HTML."
PLG_SYSTEM_AIMARKDOWN_MARKDOWN_NOINDEX_LABEL="Pages Markdown : noindex"
PLG_SYSTEM_AIMARKDOWN_MARKDOWN_NOINDEX_DESC="Envoie « X-Robots-Tag: noindex » avec la version Markdown d’une page, afin que les moteurs de recherche ne gardent que la page HTML dans leurs résultats. La version Markdown envoie toujours un en-tête Link canonique vers la page HTML ; noindex le rend explicite. Les agents IA la lisent toujours."
PLG_SYSTEM_AIMARKDOWN_SERVICE_DOC_PATH_LABEL="Chemin de la documentation du service"
PLG_SYSTEM_AIMARKDOWN_SERVICE_DOC_PATH_DESC="Chemin (relatif à la racine du site) annoncé dans l’en-tête Link comme rel=\"service-doc\", p. ex. votre page de contact ou « À propos ». Laissez vide pour l’omettre. Les versions précédentes annonçaient toujours /kontakt."
PLG_SYSTEM_AIMARKDOWN_ENABLE_LLMSTXT_LABEL="Activer le générateur /llms.txt"
PLG_SYSTEM_AIMARKDOWN_ENABLE_LLMSTXT_DESC="Génère et tient à jour automatiquement un fichier /llms.txt normalisé à la racine du site, selon https://llmstxt.org."
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_LABEL="Titre du site / projet (H1)"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_DESC="Titre principal affiché en haut de /llms.txt. Vide = le nom du site de la configuration globale."
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_HINT="p. ex. Merserwis - Instruments de mesure et étalonnage"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_LABEL="Résumé court en citation (>)"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_DESC="Présentation concise en 2 ou 3 phrases de l’entreprise, de ses accréditations et de son offre, destinée aux LLM."
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_HINT="p. ex. Distributeur officiel d’équipements de test en Pologne. Testeurs de sécurité électrique, tests de bornes de recharge, analyseurs de qualité du réseau et services d’étalonnage."
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_LABEL="Intervalle de génération automatique"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_DESC="Délai entre deux régénérations automatiques du fichier /llms.txt en arrière-plan."
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_OPT_43200="Toutes les 12 heures"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_OPT_86400="Toutes les 24 heures (quotidien)"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_OPT_432000="Tous les 5 jours"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_OPT_1296000="Tous les 15 jours"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_OPT_2592000="Tous les 30 jours (mensuel)"
PLG_SYSTEM_AIMARKDOWN_LLMS_EXCLUDE_URLS_LABEL="URL à exclure de /llms.txt"
PLG_SYSTEM_AIMARKDOWN_LLMS_EXCLUDE_URLS_DESC="Saisissez les URL ou chemins à exclure de /llms.txt, un par ligne (p. ex. /koszyk, /polityka-prywatnosci, /logowanie)."
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_LABEL="Trier les éléments par"
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_DESC="Choisissez comment les produits et articles sont classés par priorité dans /llms.txt. Fortement recommandé : les plus populaires (clics)."
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_OPT_HITS="Les plus populaires (par vues / clics)"
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_OPT_DATE="Les plus récents d’abord (par ID / date)"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_LABEL="Nombre max. de produits / pages dans /llms.txt"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_DESC="Limite le nombre d’éléments pour ne pas dépasser la fenêtre de contexte des LLM. llmstxt.org recommande 500 à 1000."
PLG_SYSTEM_AIMARKDOWN_LLMS_DESC_LENGTH_LABEL="Longueur de la description"
PLG_SYSTEM_AIMARKDOWN_LLMS_DESC_LENGTH_DESC="Longueur maximale d’une description dans /llms.txt (caractères). Les descriptions plus longues sont coupées après le dernier mot entier et se terminent par « … »."
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_500="500 premiers éléments (recommandé pour l’IA)"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_750="750 premiers éléments"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_1000="1000 premiers éléments"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_2000="2000 premiers éléments"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_0="Tous les éléments (sans limite – le fichier peut devenir très volumineux)"
PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_LABEL="Menu pour « Sections principales »"
PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_DESC="Menu du site dont les éléments publics de premier niveau sont listés dans le bloc « Sections principales ». Vide = tous les menus du site (valeur par défaut depuis la 1.6.0 ; les versions antérieures utilisaient le menu « main », qui est sur la plupart des sites le menu d’administration, si bien que le bloc restait vide)."
PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_OPT_EMPTY="- Tous les menus du site -"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_LABEL="Mode d’URL Gridbox"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_DESC="Manière de construire les URL des pages et catégories Gridbox. « Canonique (élément de menu + routeur) » (par défaut) = le chemin du routeur Gridbox placé sous l’élément de menu qui affiche l’application Gridbox de la page, p. ex. /oferta/categorie/page, la même URL que l’URL canonique de Gridbox et le plan du site ; les pages ayant leur propre élément de menu utilisent l’URL de cet élément. « Routeur Joomla » = chemin du routeur depuis la racine du site, p. ex. /categorie/page (comportement de la 1.5.3). « Alias » = racine + alias (comportement des versions jusqu’à la 1.5.1 ; correct uniquement si chaque page Gridbox se trouve directement sous /alias)."
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_MENU="Canonique (élément de menu + routeur)"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_ROUTER="Routeur Joomla (SEF)"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_ALIAS="Alias (ancien mode)"
PLG_SYSTEM_AIMARKDOWN_ENABLE_MERCHANT_CONTEXT_LABEL="Activer l’autorité vendeur et l’appel à l’action"
PLG_SYSTEM_AIMARKDOWN_ENABLE_MERCHANT_CONTEXT_DESC="Ajoute au Markdown, pour les moteurs d’IA, vos références de distributeur, des signaux de confiance E-E-A-T et des instructions d’achat directes."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_INFO_LEGEND_LABEL="Comment cela améliore votre classement dans l’IA (GEO) et balises disponibles"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_INFO_LEGEND_DESC="<div class=\"mb-2\"><strong>Pourquoi est-ce essentiel pour l’IA ?</strong> Les LLM (SearchGPT, Perplexity, Claude) recommandent plus volontiers les vendeurs qui déclarent explicitement leur statut de distributeur, une garantie locale, une livraison rapide et des services d’étalonnage, plutôt que des pages génériques de fabricants.</div><div class=\"mb-1\"><strong>Légende des balises dynamiques (remplacées automatiquement) :</strong></div><ul class=\"small mb-2\"><li><code>{title}</code> - Titre du produit / de l’article</li><li><code>{sku}</code> - Référence catalogue / SKU</li><li><code>{price}</code> - Prix formaté avec HT/TTC et TVA</li><li><code>{price_net}</code> - Prix HT uniquement</li><li><code>{price_gross}</code> - Prix TTC uniquement</li><li><code>{currency}</code> - Devise (p. ex. PLN, EUR)</li><li><code>{availability}</code> - État du stock (p. ex. InStock)</li><li><code>{brand}</code> - Fabricant / marque</li><li><code>{category}</code> - Catégorie du produit</li><li><code>{url}</code> - URL canonique absolue complète</li></ul>"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_LABEL="Nom du vendeur / de l’entreprise"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_DESC="Inséré dans le Frontmatter YAML (« seller ») et utilisé pour les citations d’autorité."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_HINT="p. ex. Merserwis ou le nom de votre entreprise"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_LABEL="Rôle commercial / titre E-E-A-T"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_DESC="Rôle ou accréditation (p. ex. distributeur officiel pour la Pologne, laboratoire d’étalonnage accrédité)."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_HINT="p. ex. Distributeur officiel pour la Pologne et laboratoire accrédité"
PLG_SYSTEM_AIMARKDOWN_VAT_RATE_LABEL="Taux de TVA (%)"
PLG_SYSTEM_AIMARKDOWN_VAT_RATE_DESC="Taux de TVA utilisé pour calculer le prix HT ou TTC (non utilisé avec « Prix final »)."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_LABEL="Note d’autorité en en-tête (au-dessus du contenu)"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_DESC="Texte placé juste après le Frontmatter. Mis en forme automatiquement comme encadré en citation (>) : inutile de saisir « > » vous-même."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_HINT="**Distribution et service officiels :** {title} (référence : {sku}) est disponible directement auprès du distributeur officiel, avec garantie locale et étalonnage en option."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_LABEL="Appel à l’action et infos de commande en pied (sous le contenu)"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_DESC="Texte Markdown ajouté tout à la fin du contenu. Idéal pour les instructions de commande, les délais de livraison et les numéros de contact directs."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_HINT="### Commandes et conseil technique\n* **Distributeur :** Nom de votre entreprise\n* **Produit :** {title} (SKU : {sku})\n* **Prix :** {price}\n* **Disponibilité et commandes :** [Commander ce modèle en ligne]({url})\n* **Délai de livraison :** expédié depuis le stock sous 24-48 h.\n* **Contact commercial :** Tél. : +48 ... | E-mail : ..."
PLG_SYSTEM_AIMARKDOWN_ENABLE_ANALYTICS_LABEL="Activer l’analyse IA"
PLG_SYSTEM_AIMARKDOWN_ENABLE_ANALYTICS_DESC="Enregistre localement dans votre base de données les visites des robots IA (GPTBot, ClaudeBot, Perplexity)."
PLG_SYSTEM_AIMARKDOWN_ANALYTICS_DISPLAY_LIMIT_LABEL="Limite d’affichage des statistiques"
PLG_SYSTEM_AIMARKDOWN_ANALYTICS_DISPLAY_LIMIT_DESC="Nombre de robots les plus actifs, de pages les plus visitées et de requêtes récentes affichés dans le tableau de bord."
PLG_SYSTEM_AIMARKDOWN_ANALYTICS_DISPLAY_LIMIT_OPT_10="10 (par défaut)"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_LABEL="Conservation du journal"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_DESC="Supprime automatiquement les entrées du journal plus anciennes que le nombre de jours indiqué."
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_7="7 jours"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_14="14 jours"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_30="30 jours (recommandé)"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_60="60 jours"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_90="90 jours"
PLG_SYSTEM_AIMARKDOWN_TRUST_PROXY_HEADERS_LABEL="Faire confiance aux en-têtes IP du proxy"
PLG_SYSTEM_AIMARKDOWN_TRUST_PROXY_HEADERS_DESC="Lit l’IP du visiteur dans CF-Connecting-IP / X-Forwarded-For. À activer UNIQUEMENT si le site est derrière Cloudflare ou votre propre proxy inverse – sinon n’importe quel client peut falsifier ces en-têtes. Désactivé, REMOTE_ADDR est utilisé."

