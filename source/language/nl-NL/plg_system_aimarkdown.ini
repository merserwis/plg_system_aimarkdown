PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_LABEL="Items sorteren op"
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_DESC="Kies hoe producten en artikelen in /llms.txt voorrang krijgen. Sterk aanbevolen: meest populair (hits)."
