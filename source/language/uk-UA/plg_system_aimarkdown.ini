PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_DESC="Головний заголовок на початку /llms.txt. Порожньо = назва сайту із загальних налаштувань."
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_HINT="напр. Merserwis — вимірювальні прилади & калібрування"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_LABEL="Короткий опис у цитаті (>)"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_DESC="Стислий огляд компанії, акредитації та пропозиції для LLM у 2–3 реченнях."
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_HINT="напр. Офіційний дистриб’ютор випробувального обладнання в Польщі. Вимірювачі електробезпеки, тестування EVSE, аналізатори якості електроенергії та послуги калібрування."
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_LABEL="Інтервал автоматичного створення"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_DESC="Проміжок часу між автоматичними фоновими перестворюваннями файлу /llms.txt."
