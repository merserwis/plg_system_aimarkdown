PLG_SYSTEM_AIMARKDOWN_EXTRA_QUERY_PARAMS_DESC="会改变您网站页面内容、必须保留在 Markdown 网址和缓存键中的网址参数，用逗号分隔（例如 filter_brand, sort）。Joomla 和 Gridbox 的路由、分页、搜索和筛选参数始终保留；其他参数（utm_*、fbclid、随机值）会被忽略，以免占满缓存。"
