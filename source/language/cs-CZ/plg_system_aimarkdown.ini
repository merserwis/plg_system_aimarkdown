PLG_SYSTEM_AIMARKDOWN_EXTRA_QUERY_PARAMS_LABEL="Další parametry dotazu"
PLG_SYSTEM_AIMARKDOWN_EXTRA_QUERY_PARAMS_DESC="Parametry dotazu, které mění obsah stránky na vašem webu a musí zůstat v URL Markdownu a v klíči mezipaměti, oddělené čárkami (např. filter_brand, sort). Směrování Joomly a Gridboxu, stránkování, vyhledávání a filtry se zachovávají vždy; ostatní parametry (utm_*, fbclid, náhodné hodnoty) se ignorují, aby nemohly zaplnit mezipaměť."
PLG_SYSTEM_AIMARKDOWN_CUSTOM_EXCLUDE_SELECTORS_LABEL="Vlastní vyloučené selektory"
PLG_SYSTEM_AIMARKDOWN_CUSTOM_EXCLUDE_SELECTORS_DESC="Zadejte jeden selektor na řádek; odpovídající prvky se z Markdownu odstraní. Podporované formáty:<br>• Třída CSS: .promo-banner, .newsletter-popup<br>• ID CSS: #live-chat, #cookie-bar<br>• Značka HTML: aside, dialog<br>• Značka s třídou: div.popup, section.advert<br>• XPath: //div[@data-banner='true']"
