PLG_SYSTEM_AIMARKDOWN_SHOW_IMAGES_DESC="Dołącza obrazy do wygenerowanego Markdown."
PLG_SYSTEM_AIMARKDOWN_SHOW_CUSTOM_FIELDS_LABEL="Pokaż pola własne"
PLG_SYSTEM_AIMARKDOWN_SHOW_CUSTOM_FIELDS_DESC="Wyświetla pola własne i specyfikację techniczną produktów z Balbooa Gridbox."
PLG_SYSTEM_AIMARKDOWN_SHOW_ALTERNATE_LINK_LABEL="Pokaż link alternatywny"
PLG_SYSTEM_AIMARKDOWN_SHOW_ALTERNATE_LINK_DESC="Dodaje nagłówek Link (RFC 8288) i znacznik link rel=alternate w sekcji head strony HTML."
PLG_SYSTEM_AIMARKDOWN_SERVICE_DOC_PATH_LABEL="Ścieżka dokumentacji usługi"
PLG_SYSTEM_AIMARKDOWN_SERVICE_DOC_PATH_DESC="Ścieżka (względem katalogu głównego witryny) ogłaszana w nagłówku Link jako rel=\"service-doc\", np. strona kontaktowa lub „O nas”. Puste = pomijana. Poprzednie wersje zawsze ogłaszały /kontakt."
PLG_SYSTEM_AIMARKDOWN_ENABLE_LLMSTXT_LABEL="Włącz generator /llms.txt"
PLG_SYSTEM_AIMARKDOWN_ENABLE_LLMSTXT_DESC="Automatycznie tworzy i aktualizuje standardowy plik /llms.txt w katalogu głównym witryny, zgodnie z https://llmstxt.org."
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_LABEL="Tytuł witryny / projektu (H1)"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_DESC="Główny tytuł wyświetlany na początku /llms.txt. Puste = nazwa witryny z konfiguracji globalnej."
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_HINT="np. Merserwis – aparatura pomiarowa i wzorcowanie"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_LABEL="Krótkie podsumowanie – cytat (>)"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_DESC="Zwięzły opis firmy, akredytacji i oferty dla LLM w 2–3 zdaniach."
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_HINT="np. Oficjalny dystrybutor aparatury pomiarowej w Polsce. Mierniki bezpieczeństwa elektrycznego, testery EVSE, analizatory jakości energii i usługi wzorcowania."
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_LABEL="Częstotliwość automatycznego generowania"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_DESC="Odstęp czasu między automatycznymi ponownymi generowaniami pliku /llms.txt w tle."
