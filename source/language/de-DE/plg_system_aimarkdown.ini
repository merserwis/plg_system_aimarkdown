PLG_SYSTEM_AIMARKDOWN_LLMS_EXCLUDE_TITLES_DESC="Wörter oder Titelteile, bei denen eine Seite aus /llms.txt ausgelassen wird, eines pro Zeile, ohne Beachtung der Groß- und Kleinschreibung (z. B. [BEENDET] für abgelaufene Aktionen, die noch veröffentlicht sind)."
PLG_SYSTEM_AIMARKDOWN_LLMS_PRIORITY_APPS_LABEL="Gridbox-Apps, die in /llms.txt zuerst stehen"
PLG_SYSTEM_AIMARKDOWN_LLMS_PRIORITY_APPS_DESC="Namen von Gridbox-Apps (z. B. Leistungen), eine pro Zeile. Die Seiten einer solchen App landen in einem eigenen Abschnitt über der Liste der beliebtesten Seiten, in der angegebenen Reihenfolge, statt zwischen den Produkten unterzugehen."
PLG_SYSTEM_AIMARKDOWN_LLMS_SKIP_GENERIC_LABEL="Links ohne allgemeine Beschreibungen"
PLG_SYSTEM_AIMARKDOWN_LLMS_SKIP_GENERIC_DESC="Hat eine Seite, Kategorie oder ein Artikel keine eigene Beschreibung, bleibt der Link in /llms.txt ohne Beschreibung, statt hundertfach denselben Satz zu wiederholen. Die Datei wird kürzer, und ein Agent liest keine Vorlagen. Ausschalten, um zu den Texten im Reiter Texte für KI zurückzukehren."
