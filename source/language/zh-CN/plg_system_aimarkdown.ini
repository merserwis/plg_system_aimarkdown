PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_DESC="其公开的顶级菜单项将列在“主要栏目”区块中的站点菜单。留空 = 所有站点菜单（自 1.6.0 起的默认值；早期版本使用菜单 main，而在大多数站点上它是管理员菜单，因此该区块一直为空）。"
PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_OPT_EMPTY="- 所有站点菜单 -"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_LABEL="Gridbox URL 模式"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_DESC="Gridbox 页面/分类 URL 的构建方式。“规范（菜单项 + 路由）”（默认）= 将 Gridbox 路由路径置于显示该页面所属 Gridbox 应用的菜单项之下，例如 /oferta/category/page，与 Gridbox 规范 URL 和站点地图中的 URL 相同；拥有自己菜单项的页面使用该菜单项的 URL。“Joomla 路由”= 从站点根目录开始的路由路径，例如 /category/page（1.5.3 的行为）。“别名”= 根目录 + 别名（1.5.1 及更早版本的行为；仅当所有 Gridbox 页面都直接位于 /alias 下时才正确）。"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_MENU="规范（菜单项 + 路由）"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_ROUTER="Joomla 路由（SEF）"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_ALIAS="别名（旧版）"
PLG_SYSTEM_AIMARKDOWN_ENABLE_MERCHANT_CONTEXT_LABEL="启用商家权威信息 & CTA"
PLG_SYSTEM_AIMARKDOWN_ENABLE_MERCHANT_CONTEXT_DESC="在面向 AI 引擎的 Markdown 中加入自定义的经销商资质、E-E-A-T 信任信号和直接购买说明。"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_INFO_LEGEND_LABEL="这如何提升您的 AI 排名（GEO）& 可用标签"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_INFO_LEGEND_DESC="<div class=\"mb-2\"><strong>为什么这对 AI 至关重要？</strong> 与通用的制造商页面相比，LLM（SearchGPT、Perplexity、Claude）更倾向于推荐明确声明经销商身份、本地保修、快速交货和校准服务的商家。</div><div class=\"mb-1\"><strong>动态标签说明（自动替换）：</strong></div><ul class=\"small mb-2\"><li><code>{title}</code> - 商品/文章标题</li><li><code>{sku}</code> - 目录编码/SKU 编号</li><li><code>{price}</code> - 含净价/含税价和增值税的格式化价格</li><li><code>{price_net}</code> - 仅净价</li><li><code>{price_gross}</code> - 仅含税价</li><li><code>{currency}</code> - 货币（例如 PLN、EUR）</li><li><code>{availability}</code> - 库存状态（例如 InStock）</li><li><code>{brand}</code> - 制造商/品牌名称</li><li><code>{category}</code> - 商品分类</li><li><code>{url}</code> - 完整的绝对规范 URL</li></ul>"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_LABEL="商家/公司名称"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_DESC="写入 YAML Frontmatter（seller），并用于权威引用。"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_HINT="例如：Merserwis 或您的公司名称"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_LABEL="业务角色/E-E-A-T 头衔"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_DESC="角色或资质头衔（例如：波兰官方经销商、认可校准实验室）。"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_HINT="例如：波兰官方经销商 & 认可实验室"
PLG_SYSTEM_AIMARKDOWN_VAT_RATE_LABEL="增值税税率（%）"
PLG_SYSTEM_AIMARKDOWN_VAT_RATE_DESC="当页面上只显示净价或含税价其中之一时，用于推算另一价格的增值税税率。"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_LABEL="页首权威说明（内容上方）"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_DESC="紧接在 Frontmatter 之后放置的文本。将自动格式化为突出显示的引用块（>），无需手动输入“>”。"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_HINT="**官方经销与服务：** {title}（编码：{sku}）可直接从官方经销商处购买，享受本地保修并可选校准服务。"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_LABEL="页脚 CTA & 订购信息（内容下方）"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_DESC="追加在内容末尾的 Markdown 文本。适合填写订购说明、交货时间和直接联系电话。"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_HINT="### 订购与技术咨询\n* **经销商：** 您的公司名称\n* **商品：** {title}（SKU：{sku}）\n* **价格：** {price}\n* **库存与订购：** [在线订购此型号]({url})\n* **交货时间：** 现货 24-48 小时内发货。\n* **销售联系：** 电话：+48 ... | 电子邮件：..."
