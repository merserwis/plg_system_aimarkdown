PLG_SYSTEM_AIMARKDOWN_ENABLE_LLMSTXT_DESC="按照 https://llmstxt.org 的规范，在站点根目录中自动生成并维护标准化的 /llms.txt 文件。"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_LABEL="站点/项目标题（H1）"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_DESC="显示在 /llms.txt 顶部的主标题。留空 = 使用全局配置中的站点名称。"
