PLG_SYSTEM_AIMARKDOWN="System - AI Markdown for Gridbox"
PLG_SYSTEM_AIMARKDOWN_XML_DESCRIPTION="Native Markdown plugin for Joomla 6 and PHP 8.5 with llmstxt.org generator, B2B Price Anchoring, caching, YAML Frontmatter, hybrid FAQ, and AI analytics."

