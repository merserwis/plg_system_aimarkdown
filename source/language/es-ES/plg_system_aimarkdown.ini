PLG_SYSTEM_AIMARKDOWN_ENABLE_FAQ_LABEL="Activar la sección de FAQ del producto"
PLG_SYSTEM_AIMARKDOWN_ENABLE_FAQ_DESC="Incluye FAQ estructuradas en el Markdown. Da prioridad al esquema FAQPage propio o a los bloques details de la descripción; si faltan, genera automáticamente preguntas y respuestas contextuales."
PLG_SYSTEM_AIMARKDOWN_AUTO_GENERATE_FAQ_LABEL="Generar automáticamente las FAQ que falten"
PLG_SYSTEM_AIMARKDOWN_AUTO_GENERATE_FAQ_DESC="Si un producto no tiene una sección de FAQ propia, genera automáticamente preguntas y respuestas (garantía, calibración, entrega, aplicaciones)."
PLG_SYSTEM_AIMARKDOWN_PRIORITIZE_PDFS_LABEL="Priorizar las descargas PDF"
PLG_SYSTEM_AIMARKDOWN_PRIORITIZE_PDFS_DESC="Extrae todos los enlaces a PDF (fichas técnicas, manuales, catálogos), los convierte en URL absolutas y los enumera en una sección propia «Descargas y documentación»."
PLG_SYSTEM_AIMARKDOWN_UNROLL_TABS_ACCORDIONS_LABEL="Extraer pestañas y acordeones"
PLG_SYSTEM_AIMARKDOWN_UNROLL_TABS_ACCORDIONS_DESC="Despliega las pestañas ocultas y los acordeones plegados en encabezados y secciones Markdown limpios y consecutivos para los agentes de IA."
PLG_SYSTEM_AIMARKDOWN_ENABLE_CACHE_LABEL="Activar la caché de Markdown"
PLG_SYSTEM_AIMARKDOWN_ENABLE_CACHE_DESC="Guarda en caché los archivos Markdown convertidos para servirlos a los agentes de IA en milisegundos y reducir la carga del servidor."
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_LABEL="Duración de la caché"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_DESC="Tiempo durante el que los archivos Markdown en caché siguen siendo válidos antes de regenerarse."
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_3600="1 hora"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_21600="6 horas"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_43200="12 horas"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_86400="24 horas (recomendado)"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_604800="7 días"
PLG_SYSTEM_AIMARKDOWN_EXTRA_QUERY_PARAMS_LABEL="Parámetros de URL adicionales"
PLG_SYSTEM_AIMARKDOWN_EXTRA_QUERY_PARAMS_DESC="Parámetros de URL que cambian el contenido de una página de su sitio y deben conservarse en la URL Markdown y en la clave de caché, separados por comas (p. ej. filter_brand, sort). Los parámetros de enrutamiento de Joomla y Gridbox, paginación, búsqueda y filtros se conservan siempre; los demás (utm_*, fbclid, valores aleatorios) se ignoran para que no llenen la caché."
PLG_SYSTEM_AIMARKDOWN_CUSTOM_EXCLUDE_SELECTORS_LABEL="Selectores de exclusión propios"
PLG_SYSTEM_AIMARKDOWN_CUSTOM_EXCLUDE_SELECTORS_DESC="Introduzca un selector por línea para eliminar del Markdown los elementos que coincidan. Formatos admitidos:<br>• Clase CSS: .promo-banner, .newsletter-popup<br>• ID CSS: #live-chat, #cookie-bar<br>• Etiqueta HTML: aside, dialog<br>• Etiqueta con clase: div.popup, section.advert<br>• XPath: //div[@data-banner='true']"
PLG_SYSTEM_AIMARKDOWN_SHOW_CATEGORY_LABEL="Mostrar la categoría"
PLG_SYSTEM_AIMARKDOWN_SHOW_CATEGORY_DESC="Muestra la categoría de la entrada o del producto en el Markdown generado."
PLG_SYSTEM_AIMARKDOWN_SHOW_TAGS_LABEL="Mostrar las etiquetas"
PLG_SYSTEM_AIMARKDOWN_SHOW_TAGS_DESC="Muestra las etiquetas en el Markdown generado."
PLG_SYSTEM_AIMARKDOWN_SHOW_AUTHOR_LABEL="Mostrar el autor"
PLG_SYSTEM_AIMARKDOWN_SHOW_AUTHOR_DESC="Muestra el autor en el Markdown generado."
PLG_SYSTEM_AIMARKDOWN_SHOW_DATE_LABEL="Mostrar la fecha"
PLG_SYSTEM_AIMARKDOWN_SHOW_DATE_DESC="Muestra la fecha de publicación en el Markdown generado."
PLG_SYSTEM_AIMARKDOWN_SHOW_DESCRIPTION_LABEL="Mostrar la descripción"
PLG_SYSTEM_AIMARKDOWN_SHOW_DESCRIPTION_DESC="Muestra la descripción principal de la entrada o del producto en el Markdown generado."
PLG_SYSTEM_AIMARKDOWN_SHOW_IMAGES_LABEL="Mostrar las imágenes"
PLG_SYSTEM_AIMARKDOWN_SHOW_IMAGES_DESC="Incluye las imágenes en el Markdown generado."
PLG_SYSTEM_AIMARKDOWN_SHOW_CUSTOM_FIELDS_LABEL="Mostrar los campos personalizados"
PLG_SYSTEM_AIMARKDOWN_SHOW_CUSTOM_FIELDS_DESC="Muestra los campos personalizados y las especificaciones técnicas de los productos de Balbooa Gridbox."
PLG_SYSTEM_AIMARKDOWN_SHOW_ALTERNATE_LINK_LABEL="Mostrar el enlace alternativo"
PLG_SYSTEM_AIMARKDOWN_SHOW_ALTERNATE_LINK_DESC="Añade la cabecera Link según RFC 8288 y la etiqueta de enlace rel=alternate en la sección head del HTML."
PLG_SYSTEM_AIMARKDOWN_SERVICE_DOC_PATH_LABEL="Ruta de la documentación del servicio"
PLG_SYSTEM_AIMARKDOWN_SERVICE_DOC_PATH_DESC="Ruta (relativa a la raíz del sitio) anunciada en la cabecera Link como rel=\"service-doc\", p. ej. su página de contacto o «quiénes somos». Vacío = no se anuncia. Las versiones anteriores anunciaban siempre /kontakt."
PLG_SYSTEM_AIMARKDOWN_ENABLE_LLMSTXT_LABEL="Activar el generador de /llms.txt"
PLG_SYSTEM_AIMARKDOWN_ENABLE_LLMSTXT_DESC="Genera y mantiene automáticamente un archivo /llms.txt estandarizado en el directorio raíz del sitio, según https://llmstxt.org."
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_LABEL="Título del sitio o proyecto (H1)"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_DESC="Título principal que se muestra al principio de /llms.txt. Vacío = el nombre del sitio de la Configuración global."
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_HINT="p. ej. Merserwis - Instrumentos de medida y calibración"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_LABEL="Resumen breve en cita (>)"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_DESC="Descripción concisa de 2-3 frases de la empresa, sus acreditaciones y su oferta para los LLM."
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_HINT="p. ej. Distribuidor oficial de equipos de ensayo en Polonia. Medidores de seguridad eléctrica, ensayos de EVSE, analizadores de calidad de la energía y servicios de calibración."
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_LABEL="Intervalo de generación automática"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_DESC="Tiempo entre regeneraciones automáticas en segundo plano del archivo /llms.txt."
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_OPT_43200="Cada 12 horas"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_OPT_86400="Cada 24 horas (diario)"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_OPT_432000="Cada 5 días"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_OPT_1296000="Cada 15 días"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_OPT_2592000="Cada 30 días (mensual)"
PLG_SYSTEM_AIMARKDOWN_LLMS_EXCLUDE_URLS_LABEL="Excluir URL de /llms.txt"
PLG_SYSTEM_AIMARKDOWN_LLMS_EXCLUDE_URLS_DESC="Introduzca las URL o rutas que se excluyen de /llms.txt, una por línea (p. ej. /koszyk, /polityka-prywatnosci, /logowanie)."
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_LABEL="Ordenar elementos por"
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_DESC="Elija cómo se priorizan los productos y artículos en /llms.txt. Muy recomendado: Más populares (visitas)."
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_OPT_HITS="Más populares (por visitas)"
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_OPT_DATE="Más recientes primero (por ID / fecha)"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_LABEL="Máximo de productos / páginas en /llms.txt"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_DESC="Limite los elementos para no superar la ventana de contexto de los LLM. llmstxt.org recomienda 500-1000."
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_500="Los 500 primeros (recomendado para IA)"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_750="Los 750 primeros"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_1000="Los 1000 primeros"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_2000="Los 2000 primeros"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_0="Todos los elementos (sin límite; el archivo puede ser muy grande)"
PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_LABEL="Menú para «Secciones principales»"
PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_DESC="Menú del sitio cuyos elementos públicos de primer nivel se enumeran en el bloque «Secciones principales». Vacío = todos los menús del sitio (valor predeterminado desde 1.6.0; las versiones anteriores usaban el menú «main», que en la mayoría de los sitios es el menú de administración, por lo que el bloque quedaba vacío)."
PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_OPT_EMPTY="- Todos los menús del sitio -"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_LABEL="Modo de URL de Gridbox"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_DESC="Cómo se construyen las URL de páginas y categorías de Gridbox. «Canónico (elemento de menú + router)» (predeterminado) = la ruta del router de Gridbox bajo el elemento de menú que muestra la aplicación Gridbox de la página, p. ej. /oferta/category/page, la misma URL que la canónica de Gridbox y el mapa del sitio; las páginas con elemento de menú propio usan la URL de ese elemento. «Router de Joomla» = ruta del router desde la raíz del sitio, p. ej. /category/page (comportamiento de 1.5.3). «Alias» = raíz + alias (comportamiento de las versiones hasta 1.5.1; solo es correcto si todas las páginas de Gridbox están directamente bajo /alias)."
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_MENU="Canónico (elemento de menú + router)"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_ROUTER="Router de Joomla (SEF)"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_ALIAS="Alias (heredado)"
PLG_SYSTEM_AIMARKDOWN_ENABLE_MERCHANT_CONTEXT_LABEL="Activar autoridad del comerciante y CTA"
PLG_SYSTEM_AIMARKDOWN_ENABLE_MERCHANT_CONTEXT_DESC="Inserta en el Markdown para los motores de IA las credenciales propias del distribuidor, señales de confianza E-E-A-T e instrucciones de compra directa."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_INFO_LEGEND_LABEL="Cómo mejora su posicionamiento en IA (GEO) y etiquetas disponibles"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_INFO_LEGEND_DESC="<div class=\"mb-2\"><strong>¿Por qué es clave para la IA?</strong> Los LLM (SearchGPT, Perplexity, Claude) prefieren recomendar comerciantes que declaran explícitamente su condición de distribuidor, garantía local, entrega rápida y servicios de calibración, en lugar de páginas genéricas del fabricante.</div><div class=\"mb-1\"><strong>Leyenda de etiquetas dinámicas (se sustituyen automáticamente):</strong></div><ul class=\"small mb-2\"><li><code>{title}</code> - Título del producto / artículo</li><li><code>{sku}</code> - Código de catálogo / número SKU</li><li><code>{price}</code> - Precio formateado con neto/bruto e IVA</li><li><code>{price_net}</code> - Solo precio neto</li><li><code>{price_gross}</code> - Solo precio bruto</li><li><code>{currency}</code> - Moneda (p. ej. PLN, EUR)</li><li><code>{availability}</code> - Estado de existencias (p. ej. InStock)</li><li><code>{brand}</code> - Fabricante / marca</li><li><code>{category}</code> - Categoría del producto</li><li><code>{url}</code> - URL canónica absoluta completa</li></ul>"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_LABEL="Nombre del comerciante / empresa"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_DESC="Se inserta en el YAML Frontmatter («seller») y se usa en las citas de autoridad."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_HINT="p. ej. Merserwis o el nombre de su empresa"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_LABEL="Función comercial / título E-E-A-T"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_DESC="Función o título de acreditación (p. ej. Distribuidor oficial en Polonia, Laboratorio de calibración acreditado)."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_HINT="p. ej. Distribuidor oficial en Polonia y laboratorio acreditado"
PLG_SYSTEM_AIMARKDOWN_VAT_RATE_LABEL="Tipo de IVA (%)"
PLG_SYSTEM_AIMARKDOWN_VAT_RATE_DESC="Tipo de IVA usado para calcular los precios neto/bruto cuando la página solo muestra uno de ellos."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_LABEL="Nota de autoridad en la cabecera (sobre el contenido)"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_DESC="Texto colocado justo después del Frontmatter. Se formatea automáticamente como cita destacada (>); no es necesario escribir «>» a mano."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_HINT="**Distribución y servicio oficiales:** {title} (código: {sku}) está disponible directamente a través del distribuidor oficial, con garantía local y calibración opcional."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_LABEL="CTA del pie e información de pedidos (bajo el contenido)"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_DESC="Texto Markdown añadido al final del contenido. Ideal para instrucciones de pedido, plazos de entrega y teléfonos de contacto directo."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_HINT="### Pedidos y asesoramiento técnico\n* **Distribuidor:** Nombre de su empresa\n* **Producto:** {title} (SKU: {sku})\n* **Precio:** {price}\n* **Disponibilidad y pedidos:** [Pedir este modelo en línea]({url})\n* **Plazo de entrega:** Envío desde stock en 24-48 h.\n* **Contacto comercial:** Tel.: +48 ... | Correo electrónico: ..."
PLG_SYSTEM_AIMARKDOWN_ENABLE_ANALYTICS_LABEL="Activar la analítica de IA"
PLG_SYSTEM_AIMARKDOWN_ENABLE_ANALYTICS_DESC="Registra localmente en su base de datos las visitas de bots de IA (GPTBot, ClaudeBot, Perplexity)."
PLG_SYSTEM_AIMARKDOWN_ANALYTICS_DISPLAY_LIMIT_LABEL="Límite de visualización de la analítica"
PLG_SYSTEM_AIMARKDOWN_ANALYTICS_DISPLAY_LIMIT_DESC="Elija cuántos bots principales, páginas más visitadas y solicitudes recientes se muestran en el panel."
PLG_SYSTEM_AIMARKDOWN_ANALYTICS_DISPLAY_LIMIT_OPT_10="10 (predeterminado)"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_LABEL="Conservación de registros"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_DESC="Elimina automáticamente los registros con más antigüedad que el número de días indicado."
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_7="7 días"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_14="14 días"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_30="30 días (recomendado)"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_60="60 días"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_90="90 días"
PLG_SYSTEM_AIMARKDOWN_TRUST_PROXY_HEADERS_LABEL="Confiar en las cabeceras IP del proxy"
PLG_SYSTEM_AIMARKDOWN_TRUST_PROXY_HEADERS_DESC="Lee la IP del visitante de CF-Connecting-IP / X-Forwarded-For. Actívelo SOLO si el sitio está detrás de Cloudflare o de su propio proxy inverso; de lo contrario, cualquier cliente puede falsificar estas cabeceras. Desactivado = se usa REMOTE_ADDR."

