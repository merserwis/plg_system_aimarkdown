PLG_SYSTEM_AIMARKDOWN_EXTRA_QUERY_PARAMS_LABEL="Extra queryparameters"
PLG_SYSTEM_AIMARKDOWN_EXTRA_QUERY_PARAMS_DESC="Queryparameters die de inhoud van een pagina op uw website veranderen en in de Markdown-URL en de cachesleutel moeten blijven, gescheiden door komma's (bijv. filter_brand, sort). Routering van Joomla en Gridbox, paginering, zoeken en filters blijven altijd behouden; andere parameters (utm_*, fbclid, willekeurige waarden) worden genegeerd, zodat ze de cache niet kunnen vullen."
PLG_SYSTEM_AIMARKDOWN_CUSTOM_EXCLUDE_SELECTORS_LABEL="Eigen uit te sluiten selectors"
PLG_SYSTEM_AIMARKDOWN_CUSTOM_EXCLUDE_SELECTORS_DESC="Voer één selector per regel in; overeenkomende elementen worden uit de Markdown verwijderd. Ondersteunde formaten:<br>• CSS-klasse: .promo-banner, .newsletter-popup<br>• CSS-ID: #live-chat, #cookie-bar<br>• HTML-tag: aside, dialog<br>• Tag met klasse: div.popup, section.advert<br>• XPath: //div[@data-banner='true']"
PLG_SYSTEM_AIMARKDOWN_SHOW_CATEGORY_LABEL="Categorie tonen"
PLG_SYSTEM_AIMARKDOWN_SHOW_CATEGORY_DESC="Toont de categorie van het bericht of product in de gemaakte Markdown."
PLG_SYSTEM_AIMARKDOWN_SHOW_TAGS_LABEL="Tags tonen"
PLG_SYSTEM_AIMARKDOWN_SHOW_TAGS_DESC="Toont tags in de gemaakte Markdown."
