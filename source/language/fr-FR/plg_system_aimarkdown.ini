PLG_SYSTEM_AIMARKDOWN_ENABLE_FAQ_LABEL="Activer la section FAQ produit"
PLG_SYSTEM_AIMARKDOWN_ENABLE_FAQ_DESC="Inclut une FAQ structurée dans le Markdown. Privilégie le schéma FAQPage personnalisé ou les blocs details de la description ; génère des questions-réponses contextuelles s'ils sont absents."
PLG_SYSTEM_AIMARKDOWN_AUTO_GENERATE_FAQ_LABEL="Générer automatiquement les FAQ manquantes"
PLG_SYSTEM_AIMARKDOWN_AUTO_GENERATE_FAQ_DESC="Si un produit n'a pas de section FAQ personnalisée, génère automatiquement des questions-réponses pertinentes (garantie, étalonnage, livraison, applications)."
PLG_SYSTEM_AIMARKDOWN_PRIORITIZE_PDFS_LABEL="Mettre en avant les PDF à télécharger"
PLG_SYSTEM_AIMARKDOWN_PRIORITIZE_PDFS_DESC="Extrait tous les liens PDF (fiches techniques, manuels, catalogues), les convertit en URL absolues et les liste dans une section dédiée « Téléchargements & documentation »."
PLG_SYSTEM_AIMARKDOWN_UNROLL_TABS_ACCORDIONS_LABEL="Extraire les onglets & accordéons"
PLG_SYSTEM_AIMARKDOWN_UNROLL_TABS_ACCORDIONS_DESC="Déplie les onglets masqués et les accordéons repliés en titres et sections Markdown successifs et lisibles pour les agents IA."
PLG_SYSTEM_AIMARKDOWN_ENABLE_CACHE_LABEL="Activer le cache Markdown"
PLG_SYSTEM_AIMARKDOWN_ENABLE_CACHE_DESC="Conserve les fichiers Markdown convertis en cache pour servir les agents IA en quelques millisecondes et réduire la charge du serveur."
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_LABEL="Durée du cache"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_DESC="Durée de validité des fichiers Markdown en cache avant leur régénération."
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_3600="1 heure"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_21600="6 heures"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_43200="12 heures"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_86400="24 heures (recommandé)"
PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_604800="7 jours"
PLG_SYSTEM_AIMARKDOWN_EXTRA_QUERY_PARAMS_LABEL="Paramètres d'URL supplémentaires"
PLG_SYSTEM_AIMARKDOWN_EXTRA_QUERY_PARAMS_DESC="Paramètres d'URL qui modifient le contenu d'une page de votre site et doivent rester dans l'URL Markdown et dans la clé de cache, séparés par des virgules (ex. filter_brand, sort). Les paramètres de routage de Joomla et Gridbox, la pagination, la recherche et les filtres sont toujours conservés ; les autres (utm_*, fbclid, valeurs aléatoires) sont ignorés pour ne pas remplir le cache."
PLG_SYSTEM_AIMARKDOWN_CUSTOM_EXCLUDE_SELECTORS_LABEL="Sélecteurs d'exclusion personnalisés"
PLG_SYSTEM_AIMARKDOWN_CUSTOM_EXCLUDE_SELECTORS_DESC="Saisissez un sélecteur par ligne pour retirer les éléments correspondants du Markdown. Formats pris en charge :<br>• Classe CSS : .promo-banner, .newsletter-popup<br>• ID CSS : #live-chat, #cookie-bar<br>• Balise HTML : aside, dialog<br>• Balise avec classe : div.popup, section.advert<br>• XPath : //div[@data-banner='true']"
PLG_SYSTEM_AIMARKDOWN_SHOW_CATEGORY_LABEL="Afficher la catégorie"
PLG_SYSTEM_AIMARKDOWN_SHOW_CATEGORY_DESC="Affiche la catégorie de l'article ou du produit dans le Markdown généré."
PLG_SYSTEM_AIMARKDOWN_SHOW_TAGS_LABEL="Afficher les tags"
PLG_SYSTEM_AIMARKDOWN_SHOW_TAGS_DESC="Affiche les tags dans le Markdown généré."
PLG_SYSTEM_AIMARKDOWN_SHOW_AUTHOR_LABEL="Afficher l'auteur"
PLG_SYSTEM_AIMARKDOWN_SHOW_AUTHOR_DESC="Affiche l'auteur dans le Markdown généré."
PLG_SYSTEM_AIMARKDOWN_SHOW_DATE_LABEL="Afficher la date"
PLG_SYSTEM_AIMARKDOWN_SHOW_DATE_DESC="Affiche la date de publication dans le Markdown généré."
PLG_SYSTEM_AIMARKDOWN_SHOW_DESCRIPTION_LABEL="Afficher la description"
PLG_SYSTEM_AIMARKDOWN_SHOW_DESCRIPTION_DESC="Affiche la description principale de l'article ou du produit dans le Markdown généré."
PLG_SYSTEM_AIMARKDOWN_SHOW_IMAGES_LABEL="Afficher les images"
PLG_SYSTEM_AIMARKDOWN_SHOW_IMAGES_DESC="Inclut les images dans le Markdown généré."
PLG_SYSTEM_AIMARKDOWN_SHOW_CUSTOM_FIELDS_LABEL="Afficher les champs personnalisés"
PLG_SYSTEM_AIMARKDOWN_SHOW_CUSTOM_FIELDS_DESC="Affiche les champs personnalisés et les caractéristiques techniques des produits de Balbooa Gridbox."
PLG_SYSTEM_AIMARKDOWN_SHOW_ALTERNATE_LINK_LABEL="Afficher le lien alternatif"
PLG_SYSTEM_AIMARKDOWN_SHOW_ALTERNATE_LINK_DESC="Ajoute l'en-tête Link RFC 8288 et la balise de lien rel=alternate dans la section head du HTML."
PLG_SYSTEM_AIMARKDOWN_SERVICE_DOC_PATH_LABEL="Chemin de la documentation du service"
PLG_SYSTEM_AIMARKDOWN_SERVICE_DOC_PATH_DESC="Chemin (relatif à la racine du site) annoncé dans l'en-tête Link comme rel=\"service-doc\", par ex. votre page de contact ou « à propos ». Laissez vide pour l'omettre. Les versions précédentes annonçaient toujours /kontakt."
PLG_SYSTEM_AIMARKDOWN_ENABLE_LLMSTXT_LABEL="Activer le générateur /llms.txt"
PLG_SYSTEM_AIMARKDOWN_ENABLE_LLMSTXT_DESC="Génère et tient à jour automatiquement un fichier /llms.txt standardisé à la racine du site, conformément à https://llmstxt.org."
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_LABEL="Titre du site / projet (H1)"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_DESC="Titre principal affiché en haut de /llms.txt. Vide = le nom du site défini dans la configuration globale."
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_HINT="par ex. Merserwis - Instruments de mesure & étalonnage"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_LABEL="Résumé court en citation (>)"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_DESC="Présentation concise en 2 ou 3 phrases de l'entreprise, de ses accréditations et de son offre, destinée aux LLM."
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_HINT="par ex. Distributeur officiel d'équipements de test en Pologne. Contrôleurs de sécurité électrique, test de bornes de recharge, analyseurs de qualité du réseau et services d'étalonnage."
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_LABEL="Intervalle de génération automatique"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_DESC="Délai entre deux régénérations automatiques du fichier /llms.txt en arrière-plan."
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_OPT_43200="Toutes les 12 heures"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_OPT_86400="Toutes les 24 heures (quotidien)"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_OPT_432000="Tous les 5 jours"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_OPT_1296000="Tous les 15 jours"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_OPT_2592000="Tous les 30 jours (mensuel)"
PLG_SYSTEM_AIMARKDOWN_LLMS_EXCLUDE_URLS_LABEL="URL exclues de /llms.txt"
PLG_SYSTEM_AIMARKDOWN_LLMS_EXCLUDE_URLS_DESC="Saisissez les URL ou chemins à exclure de /llms.txt, un par ligne (par ex. /koszyk, /polityka-prywatnosci, /logowanie)."
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_LABEL="Trier les éléments par"
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_DESC="Choisissez l'ordre de priorité des produits et articles dans /llms.txt. Fortement recommandé : les plus populaires (clics)."
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_OPT_HITS="Les plus populaires (par vues / clics)"
PLG_SYSTEM_AIMARKDOWN_LLMS_SORT_BY_OPT_DATE="Les plus récents d'abord (par ID / date)"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_LABEL="Nombre max. de produits / pages dans /llms.txt"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_DESC="Limite le nombre d'éléments pour ne pas dépasser la fenêtre de contexte des LLM. llmstxt.org recommande 500 à 1000."
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_500="500 premiers éléments (recommandé pour l'IA)"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_750="750 premiers éléments"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_1000="1000 premiers éléments"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_2000="2000 premiers éléments"
PLG_SYSTEM_AIMARKDOWN_LLMS_MAX_ITEMS_OPT_0="Tous les éléments (sans limite - le fichier peut être très volumineux)"
PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_LABEL="Menu pour « Sections principales »"
PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_DESC="Menu du site dont les éléments publics de premier niveau sont listés dans le bloc « Sections principales ». Vide = tous les menus du site (par défaut depuis la 1.6.0 ; les versions antérieures utilisaient le menu « main », qui sur la plupart des sites est le menu d'administration, si bien que le bloc restait vide)."
PLG_SYSTEM_AIMARKDOWN_LLMS_MENUTYPE_OPT_EMPTY="- Tous les menus du site -"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_LABEL="Mode d'URL Gridbox"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_DESC="Construction des URL des pages et catégories Gridbox. « Canonique (élément de menu + routeur) » (par défaut) = le chemin du routeur Gridbox placé sous l'élément de menu qui affiche l'application Gridbox de la page, par ex. /oferta/category/page, soit la même URL que la canonique Gridbox et le plan du site ; les pages ayant leur propre élément de menu utilisent l'URL de cet élément. « Routeur Joomla » = chemin du routeur depuis la racine du site, par ex. /category/page (comportement de la 1.5.3). « Alias » = racine + alias (comportement des versions jusqu'à la 1.5.1 ; correct uniquement si toutes les pages Gridbox se trouvent directement sous /alias)."
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_MENU="Canonique (élément de menu + routeur)"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_ROUTER="Routeur Joomla (SEF)"
PLG_SYSTEM_AIMARKDOWN_LLMS_GRIDBOX_URL_MODE_OPT_ALIAS="Alias (ancien mode)"
PLG_SYSTEM_AIMARKDOWN_ENABLE_MERCHANT_CONTEXT_LABEL="Activer l'autorité marchand & le CTA"
PLG_SYSTEM_AIMARKDOWN_ENABLE_MERCHANT_CONTEXT_DESC="Injecte dans le Markdown, pour les moteurs IA, vos références de distributeur, des signaux de confiance E-E-A-T et des instructions d'achat directes."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_INFO_LEGEND_LABEL="Effet sur votre visibilité IA (GEO) & tags disponibles"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_INFO_LEGEND_DESC="<div class=\"mb-2\"><strong>Pourquoi est-ce essentiel pour l'IA ?</strong> Les LLM (SearchGPT, Perplexity, Claude) recommandent plus volontiers les marchands qui déclarent explicitement leur statut de distributeur, une garantie locale, une livraison rapide et des services d'étalonnage, plutôt que des pages fabricant génériques.</div><div class=\"mb-1\"><strong>Légende des tags dynamiques (remplacés automatiquement) :</strong></div><ul class=\"small mb-2\"><li><code>{title}</code> - Titre du produit / de l'article</li><li><code>{sku}</code> - Référence catalogue / SKU</li><li><code>{price}</code> - Prix formaté HT/TTC avec TVA</li><li><code>{price_net}</code> - Prix HT uniquement</li><li><code>{price_gross}</code> - Prix TTC uniquement</li><li><code>{currency}</code> - Devise (par ex. PLN, EUR)</li><li><code>{availability}</code> - État du stock (par ex. InStock)</li><li><code>{brand}</code> - Fabricant / marque</li><li><code>{category}</code> - Catégorie du produit</li><li><code>{url}</code> - URL canonique absolue complète</li></ul>"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_LABEL="Nom du marchand / de l'entreprise"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_DESC="Injecté dans le YAML Frontmatter (« seller ») et utilisé pour les citations d'autorité."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_NAME_HINT="par ex. Merserwis ou le nom de votre entreprise"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_LABEL="Rôle commercial / titre E-E-A-T"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_DESC="Rôle ou titre d'accréditation (par ex. distributeur officiel pour la France, laboratoire d'étalonnage accrédité)."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_TYPE_HINT="par ex. Distributeur officiel pour la France & laboratoire accrédité"
PLG_SYSTEM_AIMARKDOWN_VAT_RATE_LABEL="Taux de TVA (%)"
PLG_SYSTEM_AIMARKDOWN_VAT_RATE_DESC="Taux de TVA utilisé pour calculer les prix HT/TTC lorsque la page n'en affiche qu'un seul."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_LABEL="Note d'autorité en en-tête (au-dessus du contenu)"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_DESC="Texte placé juste après le Frontmatter. Mis en forme automatiquement en citation mise en évidence (>), inutile de saisir « > » vous-même."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_HEADER_TEXT_HINT="**Distribution et service officiels :** {title} (référence : {sku}) est disponible directement auprès du distributeur officiel, avec garantie locale et étalonnage en option."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_LABEL="CTA de pied de page & infos de commande (sous le contenu)"
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_DESC="Texte Markdown ajouté tout à la fin du contenu. Idéal pour les instructions de commande, les délais de livraison et les numéros de contact directs."
PLG_SYSTEM_AIMARKDOWN_MERCHANT_FOOTER_TEXT_HINT="### Commandes et conseil technique\n* **Distributeur :** Nom de votre entreprise\n* **Produit :** {title} (SKU : {sku})\n* **Prix :** {price}\n* **Disponibilité et commandes :** [Commander ce modèle en ligne]({url})\n* **Délai de livraison :** expédié depuis notre stock sous 24-48 h.\n* **Contact commercial :** Tél. : +33 ... | E-mail : ..."
PLG_SYSTEM_AIMARKDOWN_ENABLE_ANALYTICS_LABEL="Activer les statistiques IA"
PLG_SYSTEM_AIMARKDOWN_ENABLE_ANALYTICS_DESC="Enregistre localement dans votre base de données les visites des robots IA (GPTBot, ClaudeBot, Perplexity)."
PLG_SYSTEM_AIMARKDOWN_ANALYTICS_DISPLAY_LIMIT_LABEL="Limite d'affichage des statistiques"
PLG_SYSTEM_AIMARKDOWN_ANALYTICS_DISPLAY_LIMIT_DESC="Nombre de robots principaux, de pages les plus visitées et de requêtes récentes affichés dans le tableau de bord."
PLG_SYSTEM_AIMARKDOWN_ANALYTICS_DISPLAY_LIMIT_OPT_10="10 (par défaut)"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_LABEL="Conservation des journaux"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_DESC="Supprime automatiquement les journaux plus anciens que le nombre de jours indiqué."
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_7="7 jours"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_14="14 jours"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_30="30 jours (recommandé)"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_60="60 jours"
PLG_SYSTEM_AIMARKDOWN_LOG_RETENTION_DAYS_OPT_90="90 jours"
PLG_SYSTEM_AIMARKDOWN_TRUST_PROXY_HEADERS_LABEL="Faire confiance aux en-têtes IP du proxy"
PLG_SYSTEM_AIMARKDOWN_TRUST_PROXY_HEADERS_DESC="Lit l'IP du visiteur depuis CF-Connecting-IP / X-Forwarded-For. N'activez cette option QUE si le site est derrière Cloudflare ou votre propre proxy inverse - sinon n'importe quel client peut falsifier ces en-têtes. Désactivé = REMOTE_ADDR est utilisé."

