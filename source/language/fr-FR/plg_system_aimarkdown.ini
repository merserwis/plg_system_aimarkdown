PLG_SYSTEM_AIMARKDOWN_XML_DESCRIPTION="Plugin Markdown natif pour Joomla 6 et PHP 8.5 avec générateur llmstxt.org, ancrage des prix B2B, mise en cache, Frontmatter YAML, FAQ hybride et analyse du trafic IA."

