PLG_SYSTEM_AIMARKDOWN_CACHE_TIME_OPT_604800="7 dni"
PLG_SYSTEM_AIMARKDOWN_EXTRA_QUERY_PARAMS_LABEL="Dodatkowe parametry adresu"
PLG_SYSTEM_AIMARKDOWN_EXTRA_QUERY_PARAMS_DESC="Parametry adresu, które zmieniają treść strony w Twojej witrynie i muszą zostać w adresie Markdown oraz w kluczu pamięci podręcznej, oddzielone przecinkami (np. filter_brand, sort). Parametry routingu Joomla i Gridbox, stronicowania, wyszukiwania i filtrów są zawsze zachowywane; pozostałe (utm_*, fbclid, losowe wartości) są pomijane, aby nie zapełniały pamięci podręcznej."
PLG_SYSTEM_AIMARKDOWN_CUSTOM_EXCLUDE_SELECTORS_LABEL="Własne selektory wykluczeń"
PLG_SYSTEM_AIMARKDOWN_CUSTOM_EXCLUDE_SELECTORS_DESC="Jeden selektor w wierszu; pasujące elementy są usuwane z Markdown. Obsługiwane formaty:<br>• Klasa CSS: .promo-banner, .newsletter-popup<br>• Identyfikator CSS: #live-chat, #cookie-bar<br>• Znacznik HTML: aside, dialog<br>• Znacznik z klasą: div.popup, section.advert<br>• XPath: //div[@data-banner='true']"
