PLG_SYSTEM_AIMARKDOWN_SHOW_DATE_DESC="Toont de publicatiedatum in de gemaakte Markdown."
PLG_SYSTEM_AIMARKDOWN_SHOW_DESCRIPTION_LABEL="Beschrijving tonen"
PLG_SYSTEM_AIMARKDOWN_SHOW_DESCRIPTION_DESC="Toont de hoofdbeschrijving van het bericht of product in de gemaakte Markdown."
PLG_SYSTEM_AIMARKDOWN_SHOW_IMAGES_LABEL="Afbeeldingen tonen"
PLG_SYSTEM_AIMARKDOWN_SHOW_IMAGES_DESC="Neemt afbeeldingen op in de gemaakte Markdown."
PLG_SYSTEM_AIMARKDOWN_SHOW_CUSTOM_FIELDS_LABEL="Eigen velden tonen"
PLG_SYSTEM_AIMARKDOWN_SHOW_CUSTOM_FIELDS_DESC="Toont eigen velden en technische specificaties van producten uit Balbooa Gridbox."
PLG_SYSTEM_AIMARKDOWN_SHOW_ALTERNATE_LINK_LABEL="Alternatieve link tonen"
PLG_SYSTEM_AIMARKDOWN_SHOW_ALTERNATE_LINK_DESC="Voegt de Link-header volgens RFC 8288 en de linktag rel=alternate toe aan de head-sectie van de HTML."
PLG_SYSTEM_AIMARKDOWN_SERVICE_DOC_PATH_LABEL="Pad naar servicedocumentatie"
PLG_SYSTEM_AIMARKDOWN_SERVICE_DOC_PATH_DESC="Pad (ten opzichte van de hoofdmap van de website) dat in de Link-header wordt gemeld als rel=\"service-doc\", bijv. uw contactpagina of 'over ons'-pagina. Laat leeg om het weg te laten. Eerdere versies meldden altijd /kontakt."
PLG_SYSTEM_AIMARKDOWN_ENABLE_LLMSTXT_LABEL="/llms.txt-generator inschakelen"
PLG_SYSTEM_AIMARKDOWN_ENABLE_LLMSTXT_DESC="Maakt en onderhoudt automatisch een gestandaardiseerd /llms.txt-bestand in de hoofdmap van de website, volgens https://llmstxt.org."
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_LABEL="Titel van website / project (H1)"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_DESC="De hoofdtitel bovenaan /llms.txt. Leeg = de sitenaam uit de algemene instellingen."
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_TITLE_HINT="bijv. Merserwis - Meetinstrumenten en kalibratie"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_LABEL="Korte samenvatting als citaat (>)"
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_DESC="Een beknopt overzicht in 2-3 zinnen van het bedrijf, de accreditaties en het aanbod, voor LLM's."
PLG_SYSTEM_AIMARKDOWN_LLMS_SITE_SUMMARY_HINT="bijv. Officiële distributeur van testapparatuur in Polen. Meters voor elektrische veiligheid, testen van laadpalen (EVSE), netkwaliteitsanalysatoren en kalibratiediensten."
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_LABEL="Interval voor automatisch maken"
PLG_SYSTEM_AIMARKDOWN_LLMS_AUTO_INTERVAL_DESC="Tijd tussen twee automatische vernieuwingen van het /llms.txt-bestand op de achtergrond."
